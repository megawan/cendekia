<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Robo Logic</title>
<meta name="theme-color" content="#f2891f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Logical and computational thinking games for children: program a robot, find patterns, crack the magic machine, read balances, fix buggy code and sort with AND, OR and NOT.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff6ec; --ink: #1f2a44; --card: #ffffff; --line: #f0dcc4;
    --accent: #f2891f; --accent-d: #c96a0c; --warm: #f2a33a; --good: #1f9d6b; --bad: #d9534f;
    --c-green: #1f9d6b; --c-orange: #f2891f; --c-pink: #e0558a; --c-purple: #7a5af8; --c-blue: #2e90fa; --c-teal: #0e9aa7;
    --d-U: #1f9d6b; --d-D: #7a5af8; --d-L: #e0558a; --d-R: #2e90fa; --loop: #f2891f;
    --screen: #1f2a44; --glow: #5ef2d6;
    --radius: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  html, body { margin: 0; min-height: 100%; color: var(--ink);
    font-family: "Baloo 2", system-ui, sans-serif; touch-action: manipulation; }
  /* The glow sits on a fixed layer instead of a fixed background, which repaints with visible bands on overscroll. */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(circle at 8% 6%, #ffe3c2 0, transparent 36%),
                radial-gradient(circle at 94% 20%, #d6ebff 0, transparent 34%),
                radial-gradient(circle at 50% 100%, #d9f5e8 0, transparent 42%); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 2rem; margin: 4px 0 0; line-height: 1.1; }
  h2 { font-size: clamp(1.1rem, 5vw, 1.4rem); margin: 0; text-align: center; flex: 1; line-height: 1.15; }
  .sub { margin: 0; opacity: .8; }
  .btn { font: inherit; font-weight: 700; font-size: 1.15rem; border: 0; border-radius: var(--radius);
    padding: 14px 22px; background: var(--accent); color: #fff; cursor: pointer;
    box-shadow: 0 5px 0 var(--accent-d); min-height: 56px; transition: transform .08s, box-shadow .08s, opacity .2s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-d); }
  .btn.go { background: var(--good); box-shadow: 0 5px 0 #13714c; }
  .btn.blue { background: var(--c-blue); box-shadow: 0 5px 0 #1a6cc4; }
  .btn.ghost { background: rgba(255,255,255,.8); color: var(--ink); box-shadow: none; border: 2px solid var(--line); }
  .btn.round { width: 56px; min-height: 56px; padding: 0; border-radius: 50%; font-size: 1.5rem; }
  .btn:disabled { opacity: .45; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--c-purple); outline-offset: 2px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .bar .btn { padding: 8px 14px; min-height: 46px; font-size: 1rem; box-shadow: none; }
  .stack { display: grid; gap: 14px; max-width: 420px; margin: 20px auto; }
  .note { font-size: .9rem; text-align: center; opacity: .75; margin-top: 12px; }
  .note a { color: inherit; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 2px solid var(--line);
    border-radius: 999px; padding: 4px 14px 4px 10px; font-weight: 700; white-space: nowrap; }
  .pill .ic { font-size: 1.2rem; line-height: 1; }

  /* Gbot the robot. Built from parts so its eyes, antenna and mouth can move. */
  .gbot { display: block; overflow: visible; }
  .gbot .ant { fill: var(--accent); animation: glow 1.6s ease-in-out infinite; }
  .gbot .eye { fill: var(--glow); transform-box: fill-box; transform-origin: center; animation: blinkEye 4s infinite; }
  .gbot .mouth { fill: none; stroke: var(--glow); stroke-width: 3.5; stroke-linecap: round; display: none; }
  .gbot[data-mood="happy"] .m-happy, .gbot[data-mood="cheer"] .m-cheer, .gbot[data-mood="oops"] .m-oops,
  .gbot:not([data-mood]) .m-happy { display: block; }
  .gbot[data-mood="cheer"] { animation: hop .5s ease-out; }
  .gbot[data-mood="oops"] { animation: shake .35s; }
  .gbot[data-mood="oops"] .eye { fill: #ffb4a8; }
  @keyframes glow { 50% { fill: #ffd27a; } }
  @keyframes blinkEye { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes hop { 30% { transform: translateY(-14px) scale(1.08); } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes pop { 40% { transform: scale(1.12); } }
  @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes blink { 50% { background: #fff1d6; border-color: var(--warm); } }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(242,137,31,.25); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinBack { to { transform: rotate(-360deg); } }
  @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-16px) rotate(12deg); } }

  /* Home */
  .hero { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 4px 0 10px; }
  .hero .gbot { width: 110px; height: 110px; animation: bob 3s ease-in-out infinite; }
  .pills { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .floaters { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .floaters svg { position: absolute; width: 46px; height: 46px; opacity: .22; animation: floaty 7s ease-in-out infinite; }
  .worlds { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (min-width: 620px) { .worlds { grid-template-columns: 1fr 1fr 1fr; } }
  .card { --c: var(--c-blue); position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
    text-align: center; background: var(--card); border: 2px solid var(--line); border-bottom: 6px solid var(--c);
    border-radius: var(--radius); padding: 14px 8px 12px; font: inherit; color: inherit; cursor: pointer;
    transition: transform .15s; animation: popIn .45s both; }
  .card:hover { transform: translateY(-3px); }
  .card:active { transform: translateY(3px); }
  .card .badge { width: 64px; height: 64px; border-radius: 50%; background: var(--c); color: #fff;
    display: grid; place-items: center; font-size: 2rem; line-height: 1; box-shadow: inset 0 -5px 0 rgba(0,0,0,.12); }
  .card b { font-size: 1.15rem; line-height: 1.2; }
  .card small { font-size: .85rem; opacity: .75; line-height: 1.2; }
  .card .skill { font-size: .75rem; font-weight: 700; color: var(--c); text-transform: uppercase; letter-spacing: .04em; }
  .card .meter { width: 80%; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .card .meter i { display: block; height: 100%; background: var(--warm); border-radius: 4px; }
  .card.wide { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 16px; }
  .card.wide span:last-child { text-align: left; }

  /* World: level picker */
  .about { display: flex; align-items: center; gap: 12px; background: #fff; border: 2px solid var(--line);
    border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; }
  .about .badge { flex: none; width: 54px; height: 54px; border-radius: 50%; background: var(--c); display: grid;
    place-items: center; font-size: 1.7rem; }
  .about p { margin: 0; line-height: 1.3; }
  .about small { font-weight: 700; color: var(--c); text-transform: uppercase; font-size: .75rem; letter-spacing: .04em; }
  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 10px; }
  .lv { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .lv button { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; cursor: pointer;
    background: var(--c, var(--c-blue)); color: #fff; font: inherit; font-weight: 800; font-size: 1.8rem; line-height: 1;
    box-shadow: 0 6px 0 rgba(0,0,0,.18); transition: transform .1s; animation: popIn .4s both; }
  .lv button:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .lv.locked button { background: #d4d9e2; cursor: default; font-size: 1.4rem; }
  .lv.next button { animation: popIn .4s both, bounce 1.2s ease-in-out .4s infinite;
    box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 0 0 7px rgba(242,163,58,.35); }
  .lv small { font-size: .8rem; text-align: center; line-height: 1.15; opacity: .8; min-height: 2.3em; }
  .st { display: flex; gap: 2px; height: 20px; }
  .st svg { width: 20px; height: 20px; fill: var(--line); }
  .st svg.on { fill: var(--warm); }

  /* Coach: Gbot with a speech bubble */
  .coach { display: flex; align-items: center; gap: 10px; text-align: left; margin-bottom: 10px; min-height: 64px; }
  .coach .gbot { width: 60px; height: 60px; flex: none; }
  .bubble { position: relative; flex: 1; background: #fff8e1; border: 2px solid #f1dfb2; border-radius: 16px;
    padding: 6px 12px; font-weight: 700; font-size: 1.05rem; line-height: 1.3; }
  .bubble::before { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -8px; width: 14px; height: 14px;
    background: #fff8e1; border-left: 2px solid #f1dfb2; border-bottom: 2px solid #f1dfb2; transform: rotate(45deg); }
  .coach .btn.round { width: 46px; min-height: 46px; font-size: 1.2rem; box-shadow: none; flex: none; }

  /* Robot board */
  .board { position: relative; display: grid; grid-template-columns: repeat(var(--w), 1fr);
    width: min(100%, calc(var(--w) * 76px)); margin: 0 auto 12px; border-radius: 18px; overflow: hidden;
    border: 4px solid #fff; box-shadow: 0 6px 0 rgba(31,42,68,.12); background: #bfe6a8; }
  .cell { position: relative; aspect-ratio: 1; background: #c9eeb3; display: grid; place-items: center; }
  .cell.alt { background: #b9e39f; }
  .cell.water { background: #7cc8f2; overflow: hidden; }
  .cell.water::after { content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(-20deg, transparent 0 9px, rgba(255,255,255,.35) 9px 12px);
    animation: waves 3s linear infinite; background-size: 200% 200%; }
  @keyframes waves { to { background-position: 60px 0; } }
  .cell svg { width: 78%; height: 78%; }
  .cell .gem { animation: gemFloat 1.8s ease-in-out infinite; }
  .cell .gem.got { animation: grab .45s forwards; }
  @keyframes gemFloat { 50% { transform: translateY(-4px) scale(1.05); } }
  @keyframes grab { to { transform: translateY(-30px) scale(1.6); opacity: 0; } }
  .cell .flag .cloth { transform-box: fill-box; transform-origin: left center; animation: wave 1.2s ease-in-out infinite; }
  @keyframes wave { 50% { transform: skewY(-8deg) scaleX(.9); } }
  .cell.trail::before { content: ""; position: absolute; width: 22%; height: 22%; border-radius: 50%;
    background: rgba(255,255,255,.7); animation: popIn .3s both; }
  .bot { position: absolute; left: 0; top: 0; width: calc(100% / var(--w)); aspect-ratio: 1; z-index: 2; pointer-events: none;
    transform: translate(calc(var(--x) * 100%), calc(var(--y) * 100%)); transition: transform .34s cubic-bezier(.45,.05,.4,1.3); }
  .bot .gbot { width: 92%; height: 92%; margin: 4%; transition: transform .2s; }
  .bot.walk .gbot { animation: wobble .34s; }
  .bot.bump .gbot { animation: bonk .45s; }
  .bot.dance .gbot { animation: dance .9s ease-in-out 2; }
  .bot.face-L .gbot { transform: scaleX(-1); }
  @keyframes wobble { 30% { transform: rotate(-8deg) translateY(-6%); } 70% { transform: rotate(6deg); } }
  @keyframes bonk { 30% { transform: translate(var(--bx), var(--by)) rotate(10deg); } 60% { transform: translate(0,0) rotate(-6deg); } }
  @keyframes dance { 25% { transform: translateY(-22%) rotate(-12deg); } 50% { transform: translateY(0) rotate(0); }
    75% { transform: translateY(-22%) rotate(12deg); } }

  /* Program tray and blocks */
  .tray { position: relative; min-height: 76px; background: #fff; border: 3px dashed var(--line); border-radius: var(--radius);
    padding: 10px 10px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; cursor: pointer; }
  .tray.target { border-color: var(--c-blue); }
  .tray .empty { opacity: .6; font-weight: 700; margin: 0 auto; pointer-events: none; }
  .tray .count { position: absolute; right: 10px; top: -14px; background: #fff; border: 2px solid var(--line);
    border-radius: 999px; padding: 0 10px; font-size: .85rem; font-weight: 800; }
  .tray .count.full { border-color: var(--bad); color: var(--bad); }
  .blk { --c: var(--d-R); width: 48px; height: 48px; border-radius: 14px; border: 0; background: var(--c); color: #fff;
    display: inline-grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 4px 0 rgba(0,0,0,.18);
    animation: popIn .25s both; transition: transform .1s, box-shadow .2s; font: inherit; }
  .blk svg { width: 30px; height: 30px; fill: #fff; }
  .blk.U { --c: var(--d-U); } .blk.D { --c: var(--d-D); } .blk.L { --c: var(--d-L); } .blk.R { --c: var(--d-R); }
  .blk.U svg { transform: rotate(0); } .blk.R svg { transform: rotate(90deg); }
  .blk.D svg { transform: rotate(180deg); } .blk.L svg { transform: rotate(270deg); }
  .blk.run { transform: translateY(-6px) scale(1.12); box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--warm); }
  .blk.pick { animation: pulse .9s ease-in-out infinite; box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--c-purple); }
  .blk.fixed { box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--good); }
  .loop { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px 6px 6px; border-radius: 16px;
    background: #fff1de; border: 3px solid var(--loop); animation: popIn .25s both; min-height: 64px; cursor: pointer; }
  .loop.target { background: #ffe2bd; box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--c-blue); }
  .loop.run { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--warm); }
  .loop .head { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .loop .times { font: inherit; font-weight: 800; font-size: 1.1rem; border: 0; border-radius: 10px; background: var(--loop);
    color: #fff; min-width: 46px; min-height: 30px; cursor: pointer; padding: 0 6px; }
  .loop .times.pick { animation: pulse .9s ease-in-out infinite; }
  .loop .ic { font-size: 1.2rem; line-height: 1; }
  .loop .body { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 40px; min-height: 48px; }
  .loop .body .hole { width: 40px; height: 40px; border-radius: 12px; border: 3px dashed var(--loop); opacity: .7; }
  .loop .del { font: inherit; border: 0; background: none; color: var(--bad); font-size: 1.3rem; cursor: pointer; padding: 0 2px; line-height: 1; }
  .palette { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 14px 0 10px; }
  .palette .blk { width: 64px; height: 64px; border-radius: 18px; animation: none; }
  .palette .blk svg { width: 40px; height: 40px; }
  .palette .blk:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .palette .blk.loopBtn { --c: var(--loop); font-size: 1.1rem; font-weight: 800; color: #fff; }
  .palette.nudge .blk.R { animation: pulse 1s ease-in-out infinite; }
  .tools { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .tools .btn.run { min-width: 150px; font-size: 1.3rem; }
  .fixbar { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0 0;
    background: #f1ecff; border: 2px solid #d9cffc; border-radius: var(--radius); padding: 10px; margin-bottom: 14px; animation: popIn .25s both; }
  .fixbar .lbl { font-weight: 800; width: 100%; text-align: center; }
  .fixbar .num { --c: var(--loop); font-size: 1.3rem; font-weight: 800; }

  /* Quiz shell */
  .prog { display: flex; gap: 4px; flex: 1; }
  .prog i { flex: 1; height: 12px; border-radius: 6px; background: var(--line); transition: background .3s; }
  .prog i.done { background: var(--good); }
  .combo { min-width: 56px; text-align: center; font-weight: 800; color: var(--c-orange); }
  .stage { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 14px 10px; text-align: center; margin-bottom: 14px; }
  .opts { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 10px; }
  .opt { background: var(--card); border: 3px solid var(--line); border-bottom-width: 6px; border-radius: var(--radius);
    min-height: 96px; padding: 8px 4px; font: inherit; font-size: 2rem; font-weight: 800; color: inherit; cursor: pointer;
    display: grid; place-items: center; transition: transform .08s, opacity .3s; animation: popIn .35s both; }
  .opt:nth-child(2) { animation-delay: .06s; } .opt:nth-child(3) { animation-delay: .12s; } .opt:nth-child(4) { animation-delay: .18s; }
  .opt svg.it { width: 64px; height: 64px; }
  .opt:active { transform: translateY(3px); }
  .opt:disabled { cursor: default; }
  .opt.wait { opacity: .4; }
  .opt.ok { border-color: var(--good); background: #e8f8f0; animation: pop .35s; }
  .opt.no { border-color: var(--bad); background: #fdeceb; animation: shake .3s; }
  .opt.hint { border-color: var(--warm); animation: blink .8s ease-in-out infinite; }
  .opt.fade { opacity: .35; }
  svg.it { display: block; overflow: visible; }

  /* Pattern */
  .seq { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 6px 0; }
  .seq .slot { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; background: #fbf7f1; }
  .seq .slot svg.it { width: 54px; height: 54px; animation: popIn .4s both; animation-delay: var(--d, 0s); }
  .seq .slot.q { border: 3px dashed var(--accent); font-size: 2rem; font-weight: 800; color: var(--accent);
    animation: pulse 1.2s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .seq.wave .slot { animation: bounce .5s ease-in-out both; animation-delay: var(--d, 0s); }
  .flyer { position: fixed; z-index: 20; pointer-events: none; display: grid; place-items: center;
    transition: transform .5s cubic-bezier(.5,-.3,.4,1.3); }
  .flyer svg.it { width: 64px; height: 64px; }

  /* Magic machine */
  .lab { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px; }
  .tray2 { height: 84px; display: grid; place-items: center; position: relative; }
  .tray2 > * { transition: transform .3s cubic-bezier(.5,0,.5,1), opacity .3s; }
  .tray2 svg.it { width: 64px; height: 64px; }
  .tray2 .feed { transform: translateX(70px) scale(.2); opacity: 0; }
  .tray2 .out { animation: shoot .5s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes shoot { from { transform: translateX(-70px) scale(.2); opacity: 0; } }
  .tray2 .q { width: 64px; height: 64px; border-radius: 16px; border: 3px dashed var(--accent); display: grid; place-items: center;
    font-size: 2rem; font-weight: 800; color: var(--accent); animation: popIn .3s both, pulse 1.2s ease-in-out .3s infinite; }
  .machine { width: 130px; height: 130px; }
  .machine .gear { transform-box: fill-box; transform-origin: center; }
  .machine.on .g1 { animation: spin .7s linear infinite; }
  .machine.on .g2 { animation: spinBack .5s linear infinite; }
  .machine .lamp { fill: #f6d7a7; transition: fill .2s; }
  .machine.on .lamp { animation: lamp .3s steps(2) infinite; }
  .machine.on .body { animation: rumble .12s linear infinite; }
  @keyframes lamp { 50% { fill: #ffde59; } }
  @keyframes rumble { 50% { transform: translateY(1px); } }
  .history { display: flex; flex-direction: column; gap: 6px; align-items: center; margin-top: 8px; min-height: 40px; }
  .ex { display: flex; align-items: center; gap: 10px; background: #fbf7f1; border-radius: 14px; padding: 4px 14px; animation: popIn .3s both; }
  .ex svg.it { width: 44px; height: 44px; }
  .ex .arrow { font-weight: 800; color: var(--accent); font-size: 1.4rem; }

  /* Balance */
  .scales { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .scale { width: min(100%, 250px); flex: 1 1 200px; max-width: 290px; }
  .scales.one .scale { max-width: 340px; }
  .scales:not(.one) .scale { flex: 0 1 calc(50% - 4px); }
  .scale .beam, .scale .pan { transition: transform .9s cubic-bezier(.34,1.56,.64,1); }
  .scale .beam { transform-origin: 130px 40px; }
  .scale.wob .beam { animation: wob 1s ease-in-out; }
  @keyframes wob { 25% { transform: rotate(4deg); } 60% { transform: rotate(-3deg); } }
  .numopt { display: flex; align-items: center; gap: 2px; font-size: 1.7rem; }
  .opt .numopt svg.it { width: 24px; height: 24px; }

  /* Logic filter */
  .rule { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 3px solid var(--line);

  // =====================================================================
  // Robot: programs on a grid
  // =====================================================================
  const DIR = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
  function parseMap(rows) {
    const lv = { w: rows[0].length, h: rows.length, cells: rows.map((r) => [...r]), gems: [] };
    rows.forEach((r, y) => [...r].forEach((ch, x) => {
      if (ch === 'R') lv.start = { x, y };
      if (ch === 'F') lv.goal = { x, y };
      if (ch === '*') lv.gems.push(x + ',' + y);
    }));
    return lv;
  }
  function parseProg(s) {
    const out = [];
    for (let i = 0; i < s.length;) {
      const m = /^(\d)\(([UDLR]+)\)/.exec(s.slice(i));
      if (m) { out.push({ t: 'loop', n: +m[1], body: [...m[2]].map((t) => ({ t })) }); i += m[0].length; }
      else { out.push({ t: s[i] }); i++; }
    }
    return out;
  }
  const blocks = (prog) => prog.reduce((n, b) => n + (b.t === 'loop' ? 1 + b.body.length : 1), 0);
  const blocked = (lv, x, y) => x < 0 || y < 0 || x >= lv.w || y >= lv.h || lv.cells[y][x] === '#' || lv.cells[y][x] === '~';
  // Runs a program without drawing it. Each step keeps the block it came from (i, and j inside a loop).
  function simulate(lv, prog) {
    let x = lv.start.x, y = lv.start.y;
    const got = new Set(), trace = [];
    const steps = [];
    prog.forEach((b, i) => {
      if (b.t === 'loop') { for (let r = 0; r < b.n; r++) b.body.forEach((c, j) => steps.push({ d: c.t, i, j })); }
      else steps.push({ d: b.t, i, j: -1 });
    });
    const atGoal = () => x === lv.goal.x && y === lv.goal.y;
    for (const s of steps) {
      const nx = x + DIR[s.d][0], ny = y + DIR[s.d][1];
      if (blocked(lv, nx, ny)) { trace.push(Object.assign({ x, y, bump: true }, s)); return { trace, end: 'bump' }; }
      x = nx; y = ny;
      const k = x + ',' + y, gem = lv.gems.includes(k) && !got.has(k);
      if (gem) got.add(k);
      trace.push(Object.assign({ x, y, gem }, s));
      if (atGoal() && got.size === lv.gems.length) return { trace, end: 'win' };
    }
    return { trace, end: atGoal() ? 'gems' : 'short' };
  }
  // Changes one block of a working program so that it fails.
  function makeBug(lv, prog) {
    for (let tries = 0; tries < 80; tries++) {
      const p = clone(prog), slots = [];
      p.forEach((b) => { if (b.t === 'loop') { slots.push({ loop: b }); b.body.forEach((c) => slots.push({ cmd: c })); } else slots.push({ cmd: b }); });
      const s = pick(slots);
      if (s.loop) s.loop.n = pick([2, 3, 4, 5].filter((n) => n !== s.loop.n));
      else s.cmd.t = pick(['U', 'D', 'L', 'R'].filter((d) => d !== s.cmd.t));
      if (simulate(lv, p).end !== 'win') return p;
    }
    return clone(prog);
  }

  let R = null;

    if (R.debug) { R.prog = makeBug(R.lv, sol); R.orig = clone(R.prog); }

  // The tray shows the program. Tapping a block removes it (or, when fixing, picks it).
  function renderTray() {
    const t = $('tray');
    t.innerHTML = '';
    t.classList.toggle('target', !R.debug && !R.target);
    if (R.max) {
      const n = blocks(R.prog);

    }
    if (!R.prog.length) t.insertAdjacentHTML('beforeend', '<span class="empty">The program is empty. Tap the arrows below.</span>');

        b.body.forEach((c, j) => body.appendChild(blockBtn(c, () => {
          if (R.debug) { selectFix({ cmd: c }); return; }

        }, i, j)));

        if (!R.debug) {
          const del = document.createElement('button');
          del.type = 'button'; del.className = 'del'; del.textContent = '✕'; del.setAttribute('aria-label', 'Remove the repeat block');
          del.addEventListener('click', (e) => { e.stopPropagation(); if (R.running) return; R.prog.splice(i, 1); if (R.target === b) R.target = null; afterEdit(); });
          L.appendChild(del);
        }
        L.addEventListener('click', (e) => {

        });

        t.appendChild(blockBtn(b, () => {

    });
  }
  const NAMES = { U: 'Up', D: 'Down', L: 'Left', R: 'Right' };
  function blockBtn(c, onTap, i, j) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'blk ' + c.t + (R.sel && R.sel.cmd === c ? ' pick' : '') + (c.fixed ? ' fixed' : '');

  $('tray').addEventListener('click', () => {

  function afterEdit() {
    resetBot(); renderTray();
    $('palette').classList.toggle('nudge', !R.debug && R.i === 0 && R.w.id === 'robot' && !R.prog.length);
  }
  function renderPalette() {
    const p = $('palette');
    p.innerHTML = '';
    p.hidden = R.debug;
    if (R.debug) return;
    ['U', 'L', 'R', 'D'].forEach((d) => {

  function addBlock(b) {
    if (R.running) return;
    if (R.max && blocks(R.prog) >= R.max) { sfx.bad(); rSay(P.full, 'oops'); return; }
    if (blocks(R.prog) >= 30) { sfx.bad(); return; }
    sfx.tap();
    // Loops are not nested: a new loop goes in the main program and takes the next blocks.
    if (b.t === 'loop') { R.prog.push(b); R.target = b; }
    else if (R.target) R.target.body.push(b);
    else R.prog.push(b);
    afterEdit();
  }
  $('rUndo').addEventListener('click', () => {
    if (R.running) return;

    else { R.prog.pop(); if (R.target === last) R.target = null; }
    sfx.tap(); afterEdit();
  });
  $('rClear').addEventListener('click', () => { if (R.running) return; R.prog = []; R.target = null; sfx.tap(); afterEdit(); });
  $('rReset').addEventListener('click', () => {

  // Fixing: pick a block, then choose what it should be.
  function selectFix(sel) {
    R.sel = sel; renderTray();
    const f = $('fixbar');
    f.hidden = false; f.innerHTML = '<span class="lbl">' + P.fix + '</span>';

  const STEP = 420;
  async function runProgram() {
    if (R.running) return;
    if (!blocks(R.prog)) { sfx.bad(); rSay('Add some commands first.', 'oops'); return; }
    R.sel = null; $('fixbar').hidden = true;
    resetBot(); renderTray();
    const my = ++runToken;
    R.running = true;
    ['rRun', 'rUndo', 'rClear', 'rReset'].forEach((id) => { $(id).disabled = true; });
    $('palette').querySelectorAll('button').forEach((b) => { b.disabled = true; });
    rSay('Gbot is on the move…', 'happy');
    await sleep(250);
    const res = simulate(R.lv, R.prog);
    const tray = $('tray');
    for (const st of res.trace) {
      if (my !== runToken) return;
      tray.querySelectorAll('.run').forEach((e) => e.classList.remove('run'));
      const loopEl = st.j >= 0 ? tray.querySelector('.loop[data-i="' + st.i + '"]') : null;
      if (loopEl) loopEl.classList.add('run');
      const blk = tray.querySelector('.blk[data-i="' + st.i + '"][data-j="' + st.j + '"]');
      if (blk) blk.classList.add('run');
      botEl.classList.toggle('face-L', st.d === 'L' || (st.d !== 'R' && botEl.classList.contains('face-L')));
      if (st.bump) {
        botEl.style.setProperty('--bx', DIR[st.d][0] * 30 + '%'); botEl.style.setProperty('--by', DIR[st.d][1] * 30 + '%');
        botEl.classList.remove('walk'); void botEl.offsetWidth; botEl.classList.add('bump');
        sfx.bump();
        await sleep(500);
        break;
      }
      $('board').querySelector('.cell[data-k="' + botEl.style.getPropertyValue('--x') + ',' + botEl.style.getPropertyValue('--y') + '"]').classList.add('trail');
      placeBot(st.x, st.y);
      botEl.classList.remove('walk'); void botEl.offsetWidth; botEl.classList.add('walk');
      sfx.step();
      if (st.gem) setTimeout(() => { if (my === runToken) { gemEls[st.x + ',' + st.y].classList.add('got'); sfx.gem(); } }, 220);
      await sleep(STEP);
    }
    if (my !== runToken) return;
    tray.querySelectorAll('.run').forEach((e) => e.classList.remove('run'));
    R.running = false;
    ['rRun', 'rUndo', 'rClear', 'rReset'].forEach((id) => { $(id).disabled = false; });
    $('palette').querySelectorAll('button').forEach((b) => { b.disabled = false; });

      b.type = 'button'; b.className = 'thing'; b.innerHTML = itemSvg(x);
      b.style.animationDelay = k * 0.04 + 's';
      b.setAttribute('aria-pressed', 'false');
      b.setAttribute('aria-label', (x.z === 1 ? '' : 'small ') + x.c + ' ' + x.s);
      b.addEventListener('click', () => {
        if (pool.classList.contains('done')) return;
        b.classList.remove('no', 'hint');
        b.classList.toggle('sel'); b.setAttribute('aria-pressed', b.classList.contains('sel'));
        sfx.tap();
      });
      pool.appendChild(b);
    });
    const wrap = document.createElement('div');
    wrap.className = 'check';
    const go = document.createElement('button');
    go.type = 'button'; go.className = 'btn go'; go.textContent = '✓ Check';
    go.addEventListener('click', () => {
      if (pool.classList.contains('done')) return;
      const els = [...pool.children];
      const bad = els.filter((b, k) => b.classList.contains('sel') !== passes(rule, items[k]));
      if (!bad.length) {
        pool.classList.add('done'); go.disabled = true;
        els.forEach((b, k) => {
          b.style.animationDelay = '0s';
          if (passes(rule, items[k])) { b.classList.remove('sel'); setTimeout(() => b.classList.add('pass'), k * 60); }
          else b.classList.add('drop');
        });
        solved(1600);
        return;
      }
      els.forEach((b, k) => {
        if (b.classList.contains('sel') && !passes(rule, items[k])) {
          b.classList.remove('sel', 'no'); void b.offsetWidth; b.classList.add('no'); b.setAttribute('aria-pressed', 'false');
        }
      });
      wrong(() => els.forEach((b, k) => { if (passes(rule, items[k]) && !b.classList.contains('sel')) b.classList.add('hint'); }));
    });
    wrap.appendChild(go);
    $('answers').appendChild(wrap);
  }

  const GEN = { pola: genPola, mesin: genMesin, timbang: genTimbang, saring: genSaring };

  // =====================================================================
  // Result and stickers
  // =====================================================================
  let last = null;
  function finish(w, i, stars, text) {
    const before = totalStars();
    S.best[w.id] = S.best[w.id] || [];
    S.best[w.id][i] = Math.max(best(w.id, i), stars);
    markDay(); save();
    const after = totalStars();
    const gained = STICKERS.slice(unlocked(before), unlocked(after));
    last = { w, i };
    $('resTitle').textContent = stars === 3 ? 'Amazing!' : stars === 2 ? 'Great!' : 'Good, keep practicing!';
    $('resStars').innerHTML = [0, 1, 2].map((k) => starSvg(k < stars, 'star')).join('');
    $('resText').textContent = text;
    const g = $('resGift');
    g.hidden = !gained.length;
    if (gained.length) g.innerHTML = '<b>New sticker!</b><div class="stk">' + gained.map(face).join('') + '</div>' + gained.map((k) => k.name).join(', ');
    const hasNext = i + 1 < w.levels.length;
    $('resNext').hidden = !hasNext;
    show('result');
    sfx.win(); confetti(stars * 25 + (gained.length ? 40 : 0));
  }
  $('resNext').addEventListener('click', () => play(last.w, last.i + 1));
  $('resAgain').addEventListener('click', () => play(last.w, last.i));
  $('resWorld').addEventListener('click', () => { curWorld = last.w; show('world'); });

  function renderStickers() {
    const stars = totalStars();
    $('stkStars').textContent = stars;
    const nx = STICKERS.find((k) => k.at > stars);
    $('stkNext').textContent = nx ? 'Next sticker at ' + nx.at + ' stars.' : 'You have every sticker!';
    $('sgrid').innerHTML = STICKERS.map((k) => '<div class="sticker' + (k.at <= stars ? '' : ' locked') + '">' + face(k)
      + '<b>' + (k.at <= stars ? k.name : '???') + '</b><small>⭐ ' + k.at + '</small></div>').join('');
  }

  renderHome();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>

        async src="//gc.zgo.at/count.js"></script>
