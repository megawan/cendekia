<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mundia</title>
<meta name="theme-color" content="#4c5fd5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="General knowledge for children, with interactive maps: the cities of Indonesia and the capitals of every country in the world.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f5ff; --ink: #1f2a44; --card: #ffffff; --line: #dde2f5;
    --accent: #4c5fd5; --accent-d: #3443a6; --warm: #f2a33a; --good: #1f9d6b; --bad: #d9534f;
    --c-green: #1f9d6b; --c-orange: #f2891f; --c-blue: #2e90fa; --c-teal: #0e9aa7; --c-pink: #e0558a; --c-indigo: #4c5fd5;
    --sea: #d6ecfb; --land: #e9e4d4; --land-home: #bfe3b4; --land-edge: #ffffff;
    --radius: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  html, body { margin: 0; min-height: 100%; color: var(--ink); font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 2.2rem; margin: 0; line-height: 1.05; }
  h2 { font-size: clamp(1.1rem, 5vw, 1.4rem); margin: 0; text-align: center; flex: 1; line-height: 1.15; }
  .sub { margin: 0; opacity: .8; }
  .btn { font: inherit; font-weight: 700; font-size: 1.1rem; border: 0; border-radius: var(--radius); padding: 12px 20px;
    background: var(--accent); color: #fff; cursor: pointer; min-height: 52px; }
  .btn.go { background: var(--good); }
  .btn.ghost { background: #fff; color: var(--ink); border: 2px solid var(--line); }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .bar .btn { padding: 8px 14px; min-height: 46px; font-size: 1rem; }
  .spacer { width: 46px; }
  .note { font-size: .95rem; text-align: center; opacity: .8; margin-top: 16px; }
  .note a { color: inherit; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 2px solid var(--line);
    border-radius: 999px; padding: 4px 14px 4px 10px; font-weight: 700; white-space: nowrap; }
  .stack { display: grid; gap: 14px; max-width: 420px; margin: 20px auto; }

  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes hop { 30% { transform: translateY(-14px) scale(1.08); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes fadeUp { from { transform: translateY(8px); opacity: 0; } }

  /* Home */
  .homeTop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hero { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 8px 0 12px; }
  .mascot { display: block; width: 84px; height: 84px; animation: bob 3s ease-in-out infinite; }
  .mascot .m { display: none; fill: none; stroke: #1c2038; stroke-width: 3.5; stroke-linecap: round; }
  .mascot .m-cheer { fill: #1c2038; }
  .mascot .m-happy, .mascot.cheer .m-cheer, .mascot.oops .m-oops { display: block; }
  .mascot.cheer .m-happy, .mascot.oops .m-happy { display: none; }
  .pills { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .topics { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 620px) { .topics { grid-template-columns: 1fr 1fr; } }
  .card { --c: var(--c-blue); display: flex; align-items: center; gap: 14px; text-align: left; background: var(--card);
    border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; font: inherit; color: inherit; cursor: pointer;
    animation: popIn .4s both; width: 100%; }
  .card .badge { flex: none; width: 62px; height: 62px; border-radius: 50%; background: var(--c); color: #fff;
    display: grid; place-items: center; font-size: 2rem; line-height: 1; }
  .card b { display: block; font-size: 1.15rem; line-height: 1.2; }
  .card small { display: block; font-size: .88rem; opacity: .75; line-height: 1.3; margin-top: 2px; }
  .card .meter { display: block; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 6px; }
  .card .meter i { display: block; height: 100%; background: var(--warm); border-radius: 4px; }
  .card.wide { grid-column: 1 / -1; }

  /* Topic: levels */
  .levels { display: grid; gap: 10px; }
  @media (min-width: 620px) { .levels { grid-template-columns: 1fr 1fr; } }
  .levels .card { padding: 10px 14px; }
  .levels .card .badge { width: 48px; height: 48px; font-size: 1.4rem; font-weight: 800; }
  .levels .card > span:nth-child(2) { flex: 1; }
  .st { display: flex; gap: 2px; }
  .st svg { width: 20px; height: 20px; fill: var(--line); }
  .st svg.on { fill: var(--warm); }

  /* The map */
  .mapbox { position: relative; height: clamp(240px, 52vh, 540px); border-radius: var(--radius); overflow: hidden;
    border: 2px solid var(--line); background: var(--sea); margin-bottom: 12px; }
  #map { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
  #map:active { cursor: grabbing; }
  #map .sea { fill: var(--sea); }
  #map path { fill: var(--land); stroke: var(--land-edge); stroke-width: .8; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  #map path.home { fill: var(--land-home); }
  #map path.pool { fill: #d3e9c8; }
  #map path.hl { fill: var(--warm); }
  #map path.ok { fill: #7fd3a6; }
  #map path.no { fill: #f2a7a5; }
  #map path.on { fill: #a9b4f2; }
  #map circle { fill: #fff; stroke: var(--ink); stroke-width: 1.6; vector-effect: non-scaling-stroke; cursor: pointer; }
  #map circle.big { fill: var(--accent); stroke: #fff; }
  #map circle.hl { fill: var(--warm); stroke-width: 2.5; }
  #map circle.on { fill: var(--accent); stroke: #fff; stroke-width: 2.5; }
  #map circle.ok { fill: var(--good); stroke: #fff; stroke-width: 2.5; }
  #map circle.no { fill: var(--bad); stroke: #fff; stroke-width: 2.5; }
  #map circle:focus { outline: none; }
  #map circle:focus-visible { stroke: var(--accent); stroke-width: 4; }
  #map text { font-family: inherit; font-weight: 800; fill: var(--ink); stroke: #fff; paint-order: stroke; stroke-linejoin: round; pointer-events: none; }
  .zoom { position: absolute; right: 8px; top: 8px; display: grid; gap: 6px; }
  .zoom button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--ink);
    font: inherit; font-size: 1.4rem; font-weight: 800; line-height: 1; cursor: pointer; box-shadow: 0 2px 6px -2px rgba(28,32,56,.25); }
  .hint { position: absolute; left: 8px; bottom: 8px; font-size: .8rem; font-weight: 700; background: rgba(255,255,255,.85);
    border-radius: 999px; padding: 4px 10px; pointer-events: none; }

  /* Explore */
  .info { background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 12px 16px; min-height: 76px;
    display: flex; align-items: center; gap: 12px; animation: fadeUp .25s both; }
  .info .flag { font-size: 2.4rem; line-height: 1; }
  .info > span > b { display: block; font-size: 1.25rem; }
  .info p { margin: 2px 0 0; line-height: 1.35; }

  /* Play */
  .prog { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; }
  .prog i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
  .prog i.ok { background: var(--good); }
  .prog i.miss { background: var(--warm); }
  .prog i.now { background: var(--accent); transform: scale(1.25); }
  .coach { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .coach .mascot { width: 56px; height: 56px; animation: none; flex: none; }
  .coach .mascot.cheer { animation: hop .5s ease-out; }
  .coach .mascot.oops { animation: shake .35s; }
  .bubble { position: relative; flex: 1; background: #fff; border: 2px solid var(--line); border-radius: 16px;
    padding: 8px 14px; font-weight: 700; font-size: 1.15rem; line-height: 1.3; }
  .bubble::before { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -8px; width: 14px; height: 14px;
    background: #fff; border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { font: inherit; font-weight: 800; font-size: 1.1rem; min-height: 60px; border-radius: var(--radius);
    background: #fff; color: var(--ink); border: 3px solid var(--line); cursor: pointer; padding: 6px 8px; animation: popIn .3s both; line-height: 1.2; }
  .opt.ok { background: #e3f7ec; border-color: var(--good); animation: hop .45s; }
  .opt.no { background: #fdecec; border-color: var(--bad); opacity: .6; animation: shake .35s; }
  .tapnote { text-align: center; font-weight: 700; opacity: .75; margin: 4px 0 0; }
  .why { background: #fff8e1; border: 2px solid #f1dfb2; border-radius: var(--radius); padding: 12px 14px; margin-top: 12px;
    text-align: center; animation: fadeUp .3s both; }
  .why p { margin: 0 0 10px; font-size: 1.1rem; line-height: 1.35; }
  .why b { color: var(--good); }

  /* Result */
  .result { text-align: center; }
  .result .mascot { width: 96px; height: 96px; margin: 0 auto; animation: hop .6s ease-out; }
  .stars { display: flex; justify-content: center; gap: 8px; }
  .stars svg { width: 60px; height: 60px; fill: var(--line); }
  .stars svg.on { fill: var(--warm); animation: popIn .5s both; }
  .stars svg.on:nth-child(2) { animation-delay: .2s; }
  .stars svg.on:nth-child(3) { animation-delay: .4s; }
  .summary { font-size: 1.15rem; margin: 0; }
  .gift { background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 10px; font-weight: 700; }
  .gift .face { font-size: 2.6rem; display: block; animation: popIn .5s .5s both; }

  /* Stickers */
  .sgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (min-width: 620px) { .sgrid { grid-template-columns: repeat(5, 1fr); } }
  .stk { background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 10px 6px; text-align: center; }
  .stk .face { font-size: 2.4rem; display: grid; place-items: center; width: 66px; height: 66px; margin: 0 auto 4px; border-radius: 50%; background: var(--c); }
  .stk.lock .face { filter: grayscale(1) brightness(1.3); opacity: .35; }
  .stk b { display: block; line-height: 1.15; }
  .stk small { opacity: .7; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Safiri the turtle, without a mouth: each picture adds the mouth for its mood -->
    <symbol id="turtle" viewBox="0 0 100 100">
      <ellipse cx="50" cy="90" rx="34" ry="11" fill="#5f7d3a"/>
      <path fill="#7f9f4a" d="M30 86 L38 80 L50 82 L62 80 L70 86 L62 94 L38 94Z"/>
      <ellipse cx="50" cy="58" rx="33" ry="30" fill="#7cc576"/>
      <ellipse cx="50" cy="70" rx="20" ry="13" fill="#c9edb8"/>
      <path fill="#e8c98a" d="M18 40 Q20 12 50 12 Q80 12 82 40Z"/>
      <path fill="#d8b46e" d="M30 22 Q50 14 70 22 Q60 16 50 16 Q40 16 30 22Z"/>
      <rect x="12" y="36" width="76" height="8" rx="4" fill="#c9a35c"/>
      <rect x="18" y="31" width="64" height="6" fill="#4c5fd5"/>
      <circle fill="#fff" cx="37" cy="54" r="8"/><circle fill="#fff" cx="63" cy="54" r="8"/>
      <circle fill="#1c2038" cx="38.5" cy="55" r="4.8"/><circle fill="#1c2038" cx="61.5" cy="55" r="4.8"/>
      <circle fill="#fff" cx="40" cy="53.2" r="1.7"/><circle fill="#fff" cx="63" cy="53.2" r="1.7"/>
      <circle fill="#ff8fb8" opacity=".55" cx="26" cy="66" r="4.5"/><circle fill="#ff8fb8" opacity=".55" cx="74" cy="66" r="4.5"/>
      <circle fill="#3f7a3a" cx="46" cy="64" r="1.3"/><circle fill="#3f7a3a" cx="54" cy="64" r="1.3"/>
    </symbol>
    <path id="starPath" d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/>
  </defs>
</svg>
<main>
  <!-- Home: the topics -->
  <section id="home">
    <div class="homeTop"><a class="btn ghost back" href="../">← Cendekia</a><div id="who"></div></div>
    <div class="hero" data-mascot="mundia">
      <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true"><use href="#turtle"/><path class="m m-happy" d="M42 70 Q50 77 58 70"/><path class="m m-cheer" d="M41 68 Q50 81 59 68Z"/><path class="m m-oops" d="M43 74 Q46.5 69 50 74 T57 74"/></svg>
      <div>
        <h1>Mundia</h1>
        <p class="sub">Know your world, with Safiri the turtle</p>
      </div>
    </div>
    <div class="pills">
      <span class="pill" title="Stars"><span aria-hidden="true">⭐</span><span id="homeStars">0 stars</span></span>
      <span class="pill" title="Days in a row"><span aria-hidden="true">🔥</span><span id="homeDays">0 days</span></span>
      <span class="pill" title="Stickers"><span aria-hidden="true">🗺️</span><span id="homeStk">0/10</span> stickers</span>
    </div>
    <div class="topics" id="topics"></div>
    <p class="note"><a href="../parents/">👪 For parents</a> · <a href="../">← More apps in Cendekia</a></p>
  </section>

  <!-- One topic: explore its map, or play a level -->
  <section id="topic" hidden>
    <div class="bar">
      <button type="button" class="btn ghost" data-go="home">← Home</button>
      <h2 id="tTitle">Levels</h2><span class="spacer"></span>
    </div>
    <div class="levels" id="levels"></div>
  </section>

  <!-- Explore: tap anything on the map -->
  <section id="explore" hidden>
    <div class="bar">
      <button type="button" class="btn ghost" data-go="topic">← Back</button>
      <h2 id="xTitle">Explore</h2><span class="spacer"></span>
    </div>
    <!-- The one map, moved into the screen that shows it -->
    <div class="slot" id="xSlot">
      <div class="mapbox" id="mapbox">
        <svg id="map" role="group" tabindex="0" aria-label="Map. Use the arrow keys to move it and plus or minus to zoom."></svg>
        <div class="zoom">
          <button type="button" id="zIn" aria-label="Zoom in">+</button>
          <button type="button" id="zOut" aria-label="Zoom out">−</button>
          <button type="button" id="zFit" aria-label="Show the whole area">⤢</button>
        </div>
        <span class="hint" aria-hidden="true">Drag to move · pinch to zoom</span>
      </div>
    </div>
    <div class="info" id="xInfo" aria-live="polite"></div>
  </section>

  <!-- A round of questions -->
  <section id="play" hidden>
    <div class="bar">
      <button type="button" class="btn ghost" data-go="topic">← Levels</button>
      <div class="prog" id="prog"></div>
      <span class="spacer"></span>
    </div>
    <div class="coach">
      <svg class="mascot" id="coach" viewBox="0 0 100 100" aria-hidden="true"><use href="#turtle"/><path class="m m-happy" d="M42 70 Q50 77 58 70"/><path class="m m-cheer" d="M41 68 Q50 81 59 68Z"/><path class="m m-oops" d="M43 74 Q46.5 69 50 74 T57 74"/></svg>
      <div class="bubble" id="say" aria-live="polite"></div>
    </div>
    <div class="slot" id="pSlot"></div>
    <div id="answers"></div>
    <div class="why" id="why" hidden aria-live="polite">
      <p id="whyText"></p>
      <button type="button" class="btn go" id="whyNext">Next →</button>
    </div>
  </section>

  <!-- Result -->
  <section id="result" class="result" hidden>
    <div class="stack">
      <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true"><use href="#turtle"/><path class="m m-cheer" style="display:block" d="M41 68 Q50 81 59 68Z"/></svg>
      <h2 id="resTitle">Great!</h2>
      <div class="stars" id="resStars"></div>
      <p class="summary" id="resText"></p>
      <div class="gift" id="resGift" hidden></div>
      <button type="button" class="btn go" id="resNext">Next level</button>
      <button type="button" class="btn" id="resAgain">Play again</button>
      <button type="button" class="btn ghost" data-go="topic">Choose a level</button>
    </div>
  </section>

  <!-- Stickers -->
  <section id="stickers" hidden>
    <div class="bar">
      <button type="button" class="btn ghost" data-go="home">← Back</button>
      <h2>Travel Stickers</h2>
      <span class="pill"><span aria-hidden="true">⭐</span><span id="stkStars">0</span></span>
    </div>
    <p class="note" id="stkNext"></p>
    <div class="sgrid" id="sgrid"></div>
  </section>
</main>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const CD = window.Cendekia, MAPS = window.MUNDIA_MAPS;
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Places ----
  // Latitude and longitude become map coordinates with the projection the map was drawn with (tools/make-maps.mjs):
  // d3's Natural Earth for the world and Mercator for Indonesia, then the map's own scale and offset.
  function project(map, lat, lon) {
    const l = lon * Math.PI / 180, p = lat * Math.PI / 180;
    let x, y;
    if (map.proj === 'mercator') { x = l; y = Math.log(Math.tan(Math.PI / 4 + p / 2)); } else {
      const p2 = p * p, p4 = p2 * p2;
      x = l * (0.8707 - 0.131979 * p2 + p4 * (-0.013791 + p4 * (0.003971 * p2 - 0.001529 * p4)));
      y = p * (1.007226 + p2 * (0.015085 + p4 * (-0.044475 + 0.028874 * p2 - 0.005916 * p4)));
    }
    return [map.tx + map.k * x, map.ty - map.k * y];
  }

  // Cities of Indonesia: name | province | latitude | longitude | 1 if it is the capital of the province.
  // Every provincial capital (38 provinces), and a few other well-known cities.
  const CITY_DATA = {
    sumatra: 'Banda Aceh|Aceh|5.55|95.32|1;Medan|Sumatera Utara|3.59|98.67|1;Padang|Sumatera Barat|-0.95|100.35|1;Pekanbaru|Riau|0.51|101.45|1;'
      + 'Tanjung Pinang|Kepulauan Riau|0.92|104.45|1;Jambi|Jambi|-1.61|103.61|1;Bengkulu|Bengkulu|-3.80|102.27|1;Palembang|Sumatera Selatan|-2.99|104.76|1;'
      + 'Pangkal Pinang|Kepulauan Bangka Belitung|-2.13|106.11|1;Bandar Lampung|Lampung|-5.43|105.26|1;Batam|Kepulauan Riau|1.13|104.05|0;Bukittinggi|Sumatera Barat|-0.30|100.37|0',
    java: 'Jakarta|DKI Jakarta|-6.20|106.83|1;Serang|Banten|-6.12|106.15|1;Bandung|Jawa Barat|-6.91|107.61|1;Semarang|Jawa Tengah|-6.97|110.42|1;'
      + 'Yogyakarta|DI Yogyakarta|-7.80|110.37|1;Surabaya|Jawa Timur|-7.25|112.75|1;Bogor|Jawa Barat|-6.60|106.80|0;Cirebon|Jawa Barat|-6.71|108.56|0;'
      + 'Surakarta (Solo)|Jawa Tengah|-7.57|110.82|0;Malang|Jawa Timur|-7.98|112.63|0',
    nusa: 'Denpasar|Bali|-8.65|115.22|1;Mataram|Nusa Tenggara Barat|-8.58|116.12|1;Kupang|Nusa Tenggara Timur|-10.18|123.61|1;'
      + 'Bima|Nusa Tenggara Barat|-8.46|118.73|0;Labuan Bajo|Nusa Tenggara Timur|-8.50|119.88|0',
    kalimantan: 'Pontianak|Kalimantan Barat|-0.03|109.33|1;Palangka Raya|Kalimantan Tengah|-2.21|113.92|1;Banjarbaru|Kalimantan Selatan|-3.44|114.83|1;'

    function mark(cls, dotKeys, shapeIds) {
      dots.forEach((d) => d.c.classList.remove(cls));
      shapes.forEach((ps) => ps.forEach((p) => p.classList.remove(cls)));
      (dotKeys || []).forEach((k) => { const d = dots.get(k); if (d) { d.c.classList.add(cls); gDots.appendChild(d.c); } });
      (shapeIds || []).forEach((id) => (shapes.get(id) || []).forEach((p) => p.classList.add(cls)));
    }
    function clear() { ['hl', 'ok', 'no', 'on', 'pool'].forEach((c) => mark(c)); say(null); }
    function say(text, x, y) {
      labelAt = text ? { x, y } : null;
      label.textContent = text || '';
      restyle();
    }
    function restyle() {
      const u = upp();
      dots.forEach((d) => d.c.setAttribute('r', ((d.it.big ? 1.35 : 1) * DOT * u).toFixed(2)));
      if (label && labelAt) {
        label.setAttribute('x', labelAt.x.toFixed(1)); label.setAttribute('y', (labelAt.y - 11 * u).toFixed(1));
        label.setAttribute('font-size', (LABEL * u).toFixed(2)); label.setAttribute('stroke-width', (4 * u).toFixed(2));
      }
    }
    // The view always has the same shape as the box, so a screen pixel is a map unit times upp() both ways.
    function apply(v) {
      const s = size(), a = s.w / s.h;
      const maxW = Math.max(map.w, map.h * a) * 1.1, w = Math.min(Math.max(v.w, map.w / 24), maxW), h = w / a;
      const cx = Math.min(Math.max(v.x + v.w / 2, 0), map.w), cy = Math.min(Math.max(v.y + v.h / 2, 0), map.h);
      vb = { x: cx - w / 2, y: cy - h / 2, w, h };
      svg.setAttribute('viewBox', vb.x.toFixed(2) + ' ' + vb.y.toFixed(2) + ' ' + vb.w.toFixed(2) + ' ' + vb.h.toFixed(2));
      restyle();
    }
    function goTo(v, smooth) {
      cancelAnimationFrame(anim);
      if (!smooth || reduced()) { apply(v); return; }
      const from = Object.assign({}, vb), t0 = performance.now();
      const step = (t) => {
        const k = Math.min(1, (t - t0) / 380), e = 1 - Math.pow(1 - k, 3);
        apply({ x: from.x + (v.x - from.x) * e, y: from.y + (v.y - from.y) * e, w: from.w + (v.w - from.w) * e, h: from.h + (v.h - from.h) * e });
        if (k < 1) anim = requestAnimationFrame(step);
      };
      anim = requestAnimationFrame(step);
    }
    // Fits points (and a margin) into the box; home is where ⤢ goes back to.
    function fit(points, smooth, keepHome) {
      const s = size(), a = s.w / s.h;
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      points.forEach((p) => { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); });
      if (!points.length) { x0 = 0; y0 = 0; x1 = map.w; y1 = map.h; }
      const pad = Math.max((x1 - x0), (y1 - y0)) * 0.12 + map.w * 0.02;
      let w = Math.max(x1 - x0 + 2 * pad, (y1 - y0 + 2 * pad) * a, map.w / 10);
      const v = { x: (x0 + x1) / 2 - w / 2, y: (y0 + y1) / 2 - w / a / 2, w, h: w / a };
      if (!keepHome) home = v;
      goTo(v, smooth);
    }
    // Brings a point into view if it is outside, keeping the zoom.
    function show(p) {
      const m = vb.w * 0.1;
      if (p.x > vb.x + m && p.x < vb.x + vb.w - m && p.y > vb.y + m && p.y < vb.y + vb.h - m) return;
      goTo({ x: p.x - vb.w / 2, y: p.y - vb.h / 2, w: vb.w, h: vb.h }, true);
    }
    function zoomAt(f, cx, cy, from) {
      const s = size(), v = from || vb, fx = (cx - s.left) / s.w, fy = (cy - s.top) / s.h;
      const mx = v.x + fx * v.w, my = v.y + fy * v.h, w = v.w * f, h = v.h * f;
      apply({ x: mx - fx * w, y: my - fy * h, w, h });
    }
    const centre = () => { const s = size(); return [s.left + s.w / 2, s.top + s.h / 2]; };
    $('zIn').addEventListener('click', () => { cancelAnimationFrame(anim); zoomAt(0.6, ...centre()); });
    $('zOut').addEventListener('click', () => { cancelAnimationFrame(anim); zoomAt(1 / 0.6, ...centre()); });
    $('zFit').addEventListener('click', () => { if (home) goTo(home, true); });

    // Pointer: one finger drags, two fingers pinch, a press that hardly moves is a tap.
    const pts = new Map();
    let start = null, moved = false, pinch = null;
    const mid = () => { const [a, b] = [...pts.values()]; return [(a.x + b.x) / 2, (a.y + b.y) / 2, Math.hypot(a.x - b.x, a.y - b.y) || 1]; };
    svg.addEventListener('pointerdown', (e) => {
      cancelAnimationFrame(anim);
      try { svg.setPointerCapture(e.pointerId); } catch (err) { /* already released */ }
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 1) { start = { x: e.clientX, y: e.clientY, vb: Object.assign({}, vb) }; moved = false; }
      if (pts.size === 2) { const [x, y, d] = mid(); pinch = { x, y, d, vb: Object.assign({}, vb) }; moved = true; }
    });
    svg.addEventListener('pointermove', (e) => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size >= 2 && pinch) {
        const [x, y, d] = mid(), s = size(), f = pinch.d / d;
        zoomAt(f, pinch.x, pinch.y, pinch.vb);
        apply({ x: vb.x - (x - pinch.x) * (vb.w / s.w), y: vb.y - (y - pinch.y) * (vb.h / s.h), w: vb.w, h: vb.h });
      } else if (start) {
        const dx = e.clientX - start.x, dy = e.clientY - start.y;
        if (!moved && Math.hypot(dx, dy) > 8) moved = true;
        if (moved) { const u = start.vb.w / size().w; apply({ x: start.vb.x - dx * u, y: start.vb.y - dy * u, w: start.vb.w, h: start.vb.h }); }
      }
    });
    const up = (e) => {
      if (!pts.has(e.pointerId)) return;
      const tap = e.type === 'pointerup' && pts.size === 1 && !moved;
      pts.delete(e.pointerId);
      if (pts.size < 2) pinch = null;
      if (pts.size === 1) { const [p] = [...pts.values()]; start = { x: p.x, y: p.y, vb: Object.assign({}, vb) }; }
      if (pts.size === 0) start = null;
      if (tap) hit(e.clientX, e.clientY);
    };
    svg.addEventListener('pointerup', up);
    svg.addEventListener('pointercancel', up);
    svg.addEventListener('wheel', (e) => { e.preventDefault(); cancelAnimationFrame(anim); zoomAt(Math.exp(e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
    svg.addEventListener('keydown', (e) => {
      const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (k) { e.preventDefault(); apply({ x: vb.x + k[0] * vb.w * 0.15, y: vb.y + k[1] * vb.h * 0.15, w: vb.w, h: vb.h }); }
      if (e.key === '+' || e.key === '=') zoomAt(0.7, ...centre());
      if (e.key === '-') zoomAt(1 / 0.7, ...centre());
    });
    // A tap picks the nearest dot within reach, and otherwise the country under the finger.
    function hit(cx, cy) {
      if (!tapped) return;
      const s = size(), u = upp(), mx = vb.x + (cx - s.left) * u, my = vb.y + (cy - s.top) * u;
      let near = null, bestD = HIT * u;
      dots.forEach((d, key) => { const dd = Math.hypot(d.it.x - mx, d.it.y - my); if (dd < bestD) { bestD = dd; near = key; } });
      let shape = null;
      if (!near) { const t = document.elementFromPoint(cx, cy); shape = t && t.dataset && t.dataset.id ? t.dataset.id : null; }
      tapped({ dot: near, shape });
    }
    window.addEventListener('resize', () => { if (map) apply(vb); });
    return {
      use, setDots, mark, clear, say, fit, show,
      place(slot) { slot.appendChild($('mapbox')); },
      onTap(fn) { tapped = fn; },
      has: (id) => shapes.has(id)
    };
  })();

  // ---- Screens ----
  let curTopic = TOPICS[0], curLevel = null;
  function show(id) {
    ['home', 'topic', 'explore', 'play', 'result', 'stickers'].forEach((s) => { $(s).hidden = s !== id; });
    if (id === 'home') renderHome();
    if (id === 'topic') renderTopic();
    if (id === 'stickers') renderStickers();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => { sfx.tap(); show(b.dataset.go); }));

  function renderHome() {
    const stars = totalStars(), days = streakNow();
    $('homeStars').textContent = stars + (stars === 1 ? ' star' : ' stars');
    $('homeDays').textContent = days + (days === 1 ? ' day' : ' days');
    $('homeStk').textContent = unlocked(stars) + '/' + STICKERS.length;
    const box = $('topics'); box.innerHTML = '';
    TOPICS.forEach((t, k) => {
      const max = t.levels.length * 3, got = topicStars(t);
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'card'; b.style.setProperty('--c', t.c); b.style.animationDelay = k * 0.06 + 's';
      b.setAttribute('aria-label', t.name + ', ' + got + ' of ' + max + ' stars');
      b.innerHTML = '<span class="badge" aria-hidden="true">' + t.icon + '</span><span style="flex:1"><b>' + t.name + '</b><small>' + t.blurb + '</small>'
        + '<span class="meter" aria-hidden="true"><i style="width:' + Math.round(100 * got / max) + '%"></i></span><small>' + got + ' / ' + max + ' ⭐</small></span>';
      b.addEventListener('click', () => { sfx.tap(); curTopic = t; show('topic'); });
      box.appendChild(b);
    });
    const s = document.createElement('button');
    s.type = 'button'; s.className = 'card wide'; s.style.setProperty('--c', 'var(--c-orange)'); s.style.animationDelay = '.15s';
    s.innerHTML = '<span class="badge" aria-hidden="true">🗺️</span><span><b>Travel Stickers</b><small>Collect stars to fill your travel book</small></span>';
    s.addEventListener('click', () => { sfx.tap(); show('stickers'); });
    box.appendChild(s);
  }

  function renderTopic() {
    const t = curTopic;
    $('tTitle').textContent = t.icon + ' ' + t.name;
    const box = $('levels'); box.innerHTML = '';
    const x = document.createElement('button');
    x.type = 'button'; x.className = 'card wide'; x.style.setProperty('--c', t.c);
    x.innerHTML = '<span class="badge" aria-hidden="true">🔎</span><span><b>Explore the map</b><small>Tap any place to see its name' + (t.map === 'world' ? ', flag and capital' : ' and province') + '</small></span>';
    x.addEventListener('click', () => { if (!CD.gate()) return; sfx.tap(); startExplore(t); });
    box.appendChild(x);
    t.levels.forEach((lv, i) => {
      const b = document.createElement('button'), n = lv.items().length;
      b.type = 'button'; b.className = 'card'; b.style.setProperty('--c', t.c); b.style.animationDelay = i * 0.04 + 's';
      b.setAttribute('aria-label', 'Level ' + (i + 1) + ', ' + lv.name + ', ' + best(lv) + ' stars');
      b.innerHTML = '<span class="badge" aria-hidden="true">' + (i + 1) + '</span><span><b>' + esc(lv.name) + '</b><small>' + n + (t.map === 'world' ? ' countries' : ' cities') + '</small></span>'
        + '<span class="st">' + [0, 1, 2].map((k) => starSvg(k < best(lv))).join('') + '</span>';
      b.addEventListener('click', () => { sfx.tap(); startLevel(lv); });
      box.appendChild(b);
    });
  }

  function renderStickers() {
    const stars = totalStars();
    $('stkStars').textContent = stars;
    const nx = STICKERS.find((k) => k.at > stars);
    $('stkNext').textContent = nx ? (nx.at - stars) + ' more ' + (nx.at - stars === 1 ? 'star' : 'stars') + ' for the next sticker!' : 'You have seen the whole world!';
    $('sgrid').innerHTML = STICKERS.map((k) => '<div class="stk' + (k.at <= stars ? '' : ' lock') + '"><span class="face" style="--c:' + k.c + '" aria-hidden="true">' + k.pic + '</span><b>'
      + (k.at <= stars ? k.name : '???') + '</b><small>⭐ ' + k.at + '</small></div>').join('');
  }

  // ---- What a place is ----
  const isWorld = (it) => !!it.capital;
  // Country names that take "the" in a sentence ("Where is the Netherlands?").
  const THE = /^(United |Netherlands|Philippines|Bahamas|Gambia|Maldives|Marshall|Solomon|Comoros|Seychelles|Central African|Dominican Republic|DR Congo)/;
  const named = (it) => (isWorld(it) && THE.test(it.name) ? 'the ' : '') + it.name;
  const shapeOf = (it) => (isWorld(it) && MapView.has(it.shape) ? [it.shape] : []);
  function about(it) {
    if (isWorld(it)) return 'The capital of ' + esc(named(it)) + ' is <b>' + esc(it.capital) + '</b>.';
    if (NOTES[it.name]) return esc(it.name) + ' is ' + esc(NOTES[it.name]);
    return esc(it.name) + (it.cap ? ' is the capital of <b>' + esc(it.prov) + '</b>.' : ' is a city in <b>' + esc(it.prov) + '</b>.');
  }

  // ---- Explore ----
  function startExplore(t) {
    curTopic = t;
    show('explore');
    $('xTitle').textContent = '🔎 ' + t.name;
    MapView.place($('xSlot'));
    MapView.use(t.map);
    const items = t.map === 'world' ? COUNTRIES : CITIES;
    MapView.clear();
    MapView.setDots(items, true);
    MapView.fit(t.map === 'world' ? [{ x: 0, y: 0 }, { x: MAPS.world.w, y: MAPS.world.h }] : items);
    $('xInfo').innerHTML = '<p>Tap a ' + (t.map === 'world' ? 'country or a dot' : 'dot') + ' on the map.</p>';
    MapView.onTap(({ dot, shape }) => {
      const it = items.find((c) => c.key === dot) || (shape && items.find((c) => c.shape === shape));
      if (!it) return;
      sfx.tap();
      MapView.mark('on', [it.key], shapeOf(it));
      MapView.say(it.name, it.x, it.y);
      $('xInfo').innerHTML = isWorld(it)
        ? '<span class="flag" aria-hidden="true">' + flag(it.a2) + '</span><span><b>' + esc(it.name) + '</b><p>Capital: <b>' + esc(it.capital) + '</b> · ' + esc(it.continent) + '</p></span>'
        : '<span class="flag" aria-hidden="true">📍</span><span><b>' + esc(it.name) + '</b><p>' + about(it) + '</p></span>';
    });
  }

  // ---- Playing a level ----
  // Three kinds of question: tap a place on the map ("find"), name the place that is lit up ("which"), and pick the
  // capital ("capital", for countries and provinces). A wrong answer gets a second try; a second miss shows the answer.
  let qs = [], qi = 0, tries = 0, results = [], started = 0, locked = false, pool = [], roundNo = 0;
  const PRAISE = ['Great!', 'Well done!', 'Yes, that is right!', 'Brilliant!', 'Super!', 'Spot on!', 'You got it!'];
  function makeRound(lv) {
    const items = lv.items(), kinds = curTopic.kinds;
    const order = shuffle(items);
    const out = [];
    for (let i = 0; out.length < ROUND && i < order.length * 3; i++) {
      const it = order[i % order.length];
      const kind = kinds[out.length % kinds.length];
      // A province's capital is only asked for a provincial capital.
      if (kind === 'capital' && !isWorld(it) && !it.cap) continue;
      if (out.some((q) => q.it === it)) continue;
      out.push({ kind, it });
    }
    return shuffle(out);
  }
  function choicesFor(q) {
    const world = isWorld(q.it), same = pool.filter((p) => p !== q.it);
    const all = (world ? COUNTRIES : CITIES).filter((p) => p !== q.it);
    let others;
    if (q.kind === 'capital') {
      const value = (p) => (world ? p.capital : p.name);
      const near = world ? all.filter((p) => p.continent === q.it.continent) : same.filter((p) => p.cap);
      const rest = world ? all : all.filter((p) => p.cap);
      others = shuffle(near).concat(shuffle(rest)).map(value);
      return shuffle([value(q.it)].concat([...new Set(others)].filter((v) => v !== value(q.it)).slice(0, 3)));
    }
    others = shuffle(same).concat(shuffle(all)).map((p) => p.name);
    return shuffle([q.it.name].concat([...new Set(others)].filter((v) => v !== q.it.name).slice(0, 3)));
  }

  function startLevel(lv) {
    if (!CD.gate()) return; // the parent's daily time limit
    curLevel = lv;
    pool = lv.items();
    qs = makeRound(lv); qi = 0; results = []; started = Date.now(); roundNo++;
    show('play');
    MapView.place($('pSlot'));
    MapView.use(curTopic.map);
    MapView.clear();
    MapView.setDots(pool, false);
    MapView.mark('pool', [], pool.flatMap(shapeOf));
    MapView.fit(pool);
    MapView.onTap(onMapTap);
    ask();
  }
  function renderProg() {
    $('prog').innerHTML = qs.map((_, k) => '<i class="' + (k < results.length ? (results[k] ? 'ok' : 'miss') : k === qi ? 'now' : '') + '"></i>').join('');
    $('prog').setAttribute('aria-label', 'Question ' + (qi + 1) + ' of ' + qs.length);
  }
  const mood = (m) => { const c = $('coach'); c.setAttribute('class', 'mascot'); void c.getBoundingClientRect(); if (m) c.classList.add(m); };

  function ask() {
    const q = qs[qi], it = q.it, world = isWorld(it);
    tries = 0; locked = false;
    renderProg(); mood();
    ['hl', 'ok', 'no', 'on'].forEach((c) => MapView.mark(c));
    MapView.say(null);
    $('why').hidden = true;
    const box = $('answers'); box.innerHTML = '';
    if (q.kind === 'find') {
      $('say').textContent = 'Where is ' + named(it) + (world ? '? Tap it on the map.' : '? Tap its dot.');
      box.innerHTML = '<p class="tapnote">👆 Tap the map' + (world ? ' (the country or its capital dot)' : '') + '</p>';
      return;
    }
    MapView.mark('hl', [it.key], shapeOf(it));
    MapView.show(it);
    $('say').textContent = q.kind === 'which'
      ? (world ? 'Which country is this?' : 'Which city is this?')
      : 'What is the capital of ' + (world ? named(it) : it.prov) + '?';
    const opts = document.createElement('div'); opts.className = 'opts';
    choicesFor(q).forEach((v, k) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.textContent = v; b.dataset.v = v; b.style.animationDelay = k * 0.05 + 's';
      b.addEventListener('click', () => answer(v === (q.kind === 'capital' && world ? it.capital : it.name), b));
      opts.appendChild(b);
    });
    box.appendChild(opts);
  }
  function onMapTap({ dot, shape }) {
    const q = qs[qi];
    if (locked || !q || q.kind !== 'find') return;
    const it = q.it;
    const got = pool.find((p) => p.key === dot) || (shape && pool.find((p) => p.shape === shape)) || (shape && COUNTRIES.find((p) => p.shape === shape));
    if (!got && (!shape || !isWorld(it))) return; // the sea, or land away from the city dots
    if (got === it) { answer(true); return; }
    if (got) { MapView.mark('no', [got.key], shapeOf(got)); MapView.say(got.name, got.x, got.y); }
    answer(false, null, got);
  }

  function answer(right, btn, wrongPlace) {
    if (locked) return;
    const q = qs[qi], it = q.it;
    if (right) {
      locked = true;
      results.push(tries === 0);
      sfx.good(); mood('cheer');
      $('say').textContent = pick(PRAISE);
      if (btn) btn.classList.add('ok');
      MapView.mark('hl'); MapView.mark('no');
      MapView.mark('ok', [it.key], shapeOf(it));
      MapView.say(it.name, it.x, it.y);
      renderProg();
      const r = roundNo; setTimeout(() => { if (r === roundNo) next(); }, 1300);
      return;
    }
    tries++;
    sfx.bad(); mood('oops');
    if (tries === 1) CD.weak('mundia', curLevel.name + ': ' + it.name);
    if (btn) { btn.classList.add('no'); btn.disabled = true; }
    if (tries === 1) {
      $('say').textContent = wrongPlace ? 'That is ' + named(wrongPlace) + '. Try again!' : 'Not quite. Have another go!';
      return;
    }
    // Second miss: show where it is and what to remember.
    locked = true;
    results.push(false);
    renderProg();
    $('answers').querySelectorAll('.opt').forEach((b) => { if (b.dataset.v === (q.kind === 'capital' && isWorld(it) ? it.capital : it.name)) b.classList.add('ok'); b.disabled = true; });
    MapView.mark('hl'); MapView.mark('no');
    MapView.mark('ok', [it.key], shapeOf(it));
    MapView.say(it.name, it.x, it.y);
    MapView.show(it);
    $('say').textContent = 'Here it is!';
    $('whyText').innerHTML = about(it);
    $('why').hidden = false;
    $('whyNext').focus();
  }
  $('whyNext').addEventListener('click', () => { sfx.tap(); next(); });
  function next() {
    if ($('play').hidden) return;
    qi++;
    if (qi < qs.length) ask(); else finish();
  }

  function finish() {
    const lv = curLevel, right = results.filter(Boolean).length, misses = qs.length - right;
    const stars = misses === 0 ? 3 : misses <= 2 ? 2 : 1;
    const before = totalStars();
    S.best[lv.id] = Math.max(best(lv), stars);
    S.stars = totalStars();
    markDay(); save();
    CD.round({ app: 'mundia', stage: lv.name, stars, right, total: qs.length, ms: Date.now() - started });
    show('result');
    sfx.win();
    $('resTitle').textContent = stars === 3 ? 'Perfect!' : stars === 2 ? 'Great job!' : 'Well done!';
    $('resStars').innerHTML = [0, 1, 2].map((k) => starSvg(k < stars)).join('');
    $('resText').textContent = right + ' of ' + qs.length + ' right on the first try.' + (stars < 3 ? ' Play again for ' + (stars === 2 ? 'three' : 'more') + ' stars!' : '');
    const gained = STICKERS.filter((k) => k.at > before && k.at <= S.stars);
    $('resGift').hidden = !gained.length;
    if (gained.length) $('resGift').innerHTML = '<span class="face" aria-hidden="true">' + gained[gained.length - 1].pic + '</span>New sticker: ' + gained[gained.length - 1].name + '!';
    const i = curTopic.levels.indexOf(lv);
    $('resNext').hidden = i + 1 >= curTopic.levels.length;
    if (stars === 3) CD.fx.confetti(24, { glyphs: ['⭐', '🎉', '✨', '🌍', '🏝️', '🗺️'] });
  }
  $('resNext').addEventListener('click', () => { sfx.tap(); startLevel(curTopic.levels[curTopic.levels.indexOf(curLevel) + 1]); });
  $('resAgain').addEventListener('click', () => { sfx.tap(); startLevel(curLevel); });

  CD.chip($('who'));
