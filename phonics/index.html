<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Phonics Fun</title>
<meta name="theme-color" content="#7a5af8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="A simple game for children to learn English phonics: letter sounds, blending, spelling and first sentences, with sound.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f0ff; --ink: #1f2a44; --card: #ffffff; --line: #ddd3f7;
    --accent: #7a5af8; --accent-d: #5b3fd6; --warm: #f2a33a; --warm-d: #c2801f; --good: #1f9d6b; --bad: #d9534f;
    --c-green: #1f9d6b; --c-orange: #f2891f; --c-pink: #e0558a; --c-purple: #7a5af8; --c-blue: #2e90fa; --c-teal: #0e9aa7;
    --radius: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  html, body { margin: 0; min-height: 100%; color: var(--ink);
    font-family: "Baloo 2", system-ui, sans-serif; touch-action: manipulation; }
  /* The glow sits on a fixed layer instead of a fixed background, which repaints with visible bands on overscroll. */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(circle at 10% 6%, #fff1c2 0, transparent 36%),
                radial-gradient(circle at 92% 24%, #ffe0ec 0, transparent 34%),
                radial-gradient(circle at 50% 100%, #d9f5e8 0, transparent 40%); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 1.9rem; margin: 4px 0 0; line-height: 1.1; }
  h2 { font-size: clamp(1.15rem, 5vw, 1.4rem); margin: 0; text-align: center; flex: 1; white-space: nowrap; }
  .sub { margin: 0; opacity: .8; }
  .btn { font: inherit; font-weight: 700; font-size: 1.15rem; border: 0; border-radius: var(--radius);
    padding: 14px 22px; background: var(--accent); color: #fff; cursor: pointer;
    box-shadow: 0 5px 0 var(--accent-d); min-height: 56px; transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-d); }
  .btn.alt { background: var(--warm); box-shadow: 0 5px 0 var(--warm-d); }
  .btn.ghost { background: rgba(255,255,255,.75); color: var(--ink); box-shadow: none; border: 2px solid var(--line); }
  .btn.round { width: 64px; min-height: 64px; padding: 0; border-radius: 50%; font-size: 1.8rem; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--c-purple); outline-offset: 2px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .bar .btn { padding: 8px 16px; min-height: 46px; font-size: 1rem; box-shadow: none; }
  .bar .spacer { width: 46px; }
  .stack { display: grid; gap: 14px; max-width: 420px; margin: 20px auto; }
  .center { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .note { font-size: .9rem; text-align: center; opacity: .75; margin-top: 12px; }
  .note a { color: inherit; }

  /* Home */
  .hero { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 4px 0 10px; }
  .hero .mascot { width: 104px; height: 104px; animation: bob 3s ease-in-out infinite; }
  .pills { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 2px solid var(--line);
    border-radius: 999px; padding: 4px 14px 4px 10px; font-weight: 700; }
  .pill .ic { font-size: 1.2rem; line-height: 1; }
  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { --c: var(--c-blue); position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
    text-align: center; background: var(--card); border: 2px solid var(--line); border-bottom: 6px solid var(--c);
    border-radius: var(--radius); padding: 14px 8px 12px; font: inherit; color: inherit; cursor: pointer;
    transition: transform .1s; }
  .card:active { transform: translateY(3px); }
  .card .badge { width: 62px; height: 62px; border-radius: 50%; background: var(--c); color: #fff;
    display: grid; place-items: center; font-size: 1.8rem; font-weight: 800; line-height: 1; }
  .card b { font-size: 1.15rem; line-height: 1.2; }
  .card small { font-size: .85rem; opacity: .75; line-height: 1.2; }
  .card.hero-card { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 16px; padding: 18px 12px; }
  .card.hero-card .badge { width: 76px; height: 76px; font-size: 2.4rem; }
  .card.hero-card b { font-size: 1.5rem; }
  .card.hero-card span:last-child { text-align: left; }

  /* Mascot: Kiki the owl */
  .mascot { display: block; }
  .mascot .m { display: none; fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
  .mascot[data-mood="happy"] .m.smile, .mascot[data-mood="cheer"] .m.smile, .mascot[data-mood="oops"] .m.oops { display: block; }
  .mascot[data-mood="cheer"] { animation: hop .5s ease-out; }
  .mascot[data-mood="oops"] { animation: shake .3s; }
  @keyframes hop { 30% { transform: translateY(-14px) scale(1.08); } }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes pop { 40% { transform: scale(1.08); } }
  @keyframes blink { 50% { background: #fff1d6; } }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  .coach { display: flex; align-items: center; gap: 10px; text-align: left; margin-bottom: 8px; min-height: 64px; }
  .coach .mascot { width: 64px; height: 64px; flex: none; }
  .bubble { position: relative; background: #fff8e1; border: 2px solid #f1dfb2; border-radius: 16px;
    padding: 6px 14px; font-weight: 700; font-size: 1.1rem; }
  .bubble::before { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -8px; width: 14px; height: 14px;
    background: #fff8e1; border-left: 2px solid #f1dfb2; border-bottom: 2px solid #f1dfb2; transform: rotate(45deg); }

  /* Adventure map */
  .map { position: relative; padding: 8px 0 16px; }
  .map::before { content: ""; position: absolute; left: 50%; top: 40px; bottom: 50px; width: 0;
    border-left: 6px dashed var(--line); transform: translateX(-3px); }
  .node { position: relative; display: flex; flex-direction: column; align-items: center; width: 150px;
    margin: 0 auto 10px; transform: translateX(var(--x, 0)); }
  .node button { width: 92px; height: 92px; border-radius: 50%; border: 4px solid #fff; cursor: pointer;
    background: var(--c, var(--c-blue)); color: #fff; font: inherit; font-weight: 800; font-size: 2rem; line-height: 1;
    box-shadow: 0 6px 0 rgba(0,0,0,.18); transition: transform .1s; }
  .node button:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .node.locked button { background: #c9d3e1; color: #fff; cursor: default; }
  .node.next button { animation: bounce 1.2s ease-in-out infinite; box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 0 0 8px rgba(242,163,58,.35); }
  .node b { margin-top: 6px; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 0 10px;
    font-size: 1rem; text-align: center; line-height: 1.4; }
  .node .st { display: flex; gap: 2px; height: 22px; margin-top: 2px; }
  .node .st svg { width: 22px; height: 22px; fill: var(--line); }
  .node .st svg.on { fill: var(--warm); }
  .goal { text-align: center; font-size: 3rem; line-height: 1; position: relative; }

  /* Explore: sounds and words */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(7, 1fr); } }
  .tile { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 6px 0 8px; text-align: center; cursor: pointer; font: inherit; color: inherit; font-size: 1.8rem;
    font-weight: 800; transition: transform .1s; min-height: 64px; }
  .tile:active { transform: scale(.95); }
  .tile.on { border-color: var(--accent); background: #ece6ff; }
  .tile small { display: block; font-size: .8rem; font-weight: 500; opacity: .75; }
  .stage { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 16px; text-align: center; margin-bottom: 14px; }
  .stage .big { font-size: 5.5rem; font-weight: 800; line-height: 1.05; }
  .stage .pic { font-size: 4rem; line-height: 1.2; }
  .stage .name { font-size: 1.5rem; font-weight: 700; }
  .stage .row { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .wgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 560px) { .wgrid { grid-template-columns: repeat(3, 1fr); } }
  .wcard { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 10px 6px;
    font: inherit; color: inherit; cursor: pointer; text-align: center; }
  .wcard .pic { font-size: 2.8rem; line-height: 1.2; display: block; }
  .wcard .w { font-size: 1.5rem; font-weight: 800; }
  /* One span per sound; two letters that make one sound are underlined. */
  .gph { display: inline-block; padding: 0 2px; border-radius: 8px; transition: background .15s, color .15s; }
  .gph.di { text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 8px; text-decoration-color: var(--c-orange); }
  .gph.lit, .word.lit, .slot.lit { background: var(--warm); color: #fff; }

  /* Quiz */
  .prog { display: flex; gap: 4px; flex: 1; }
  .prog i { flex: 1; height: 12px; border-radius: 6px; background: var(--line); transition: background .3s; }
  .prog i.done { background: var(--good); }
  .combo { min-width: 64px; text-align: center; font-weight: 800; color: var(--c-orange); }
  .ask { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ask .big { font-size: 4.5rem; font-weight: 800; line-height: 1.1; }
  .ask .pic { font-size: 4.5rem; line-height: 1.15; }
  .sentence { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px; font-size: 2.4rem; font-weight: 800; line-height: 1.2; }
  .word { font: inherit; color: inherit; background: none; border: 0; border-bottom: 3px dotted var(--line);
    border-radius: 8px; padding: 0 4px; cursor: pointer; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opts.three { grid-template-columns: 1fr 1fr 1fr; }
  .opt { background: var(--card); border: 3px solid var(--line); border-bottom-width: 6px; border-radius: var(--radius);
    min-height: 110px; padding: 8px 4px; font: inherit; font-size: 2.6rem; font-weight: 800; color: inherit; cursor: pointer;
    transition: transform .08s; line-height: 1.1; }
  .opt.pic { font-size: 3.4rem; }
  .opts.three .opt { font-size: 2.4rem; }
  .opt:active { transform: translateY(3px); }
  .opt.ok { border-color: var(--good); background: #e8f8f0; animation: pop .35s; }
  .opt.no { border-color: var(--bad); background: #fdeceb; animation: shake .3s; }
  .opt.hint { border-color: var(--warm); animation: blink .8s ease-in-out infinite; }
  .slots { display: flex; justify-content: center; gap: 8px; margin: 6px 0 2px; }
  .slot { min-width: 76px; height: 76px; border-radius: 16px; border: 3px dashed var(--line); display: grid; place-items: center;
    font-size: 2.2rem; font-weight: 800; background: rgba(255,255,255,.6); }
  .slot.full { border-style: solid; border-color: var(--good); background: #e8f8f0; animation: pop .3s; }
  .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .tiles .opt { min-height: 76px; min-width: 96px; font-size: 2.2rem; }
  .tiles .opt.used { visibility: hidden; }

  /* Result and stickers */
  .stars { display: flex; justify-content: center; gap: 6px; margin: 12px 0; }
  .star { width: 64px; height: 64px; fill: var(--line); }
  .star.on { fill: var(--warm); animation: pop .5s both; }
  .star.on:nth-child(2) { animation-delay: .2s; } .star.on:nth-child(3) { animation-delay: .4s; }
  .summary { text-align: center; font-weight: 700; margin: 8px 0; font-size: 1.15rem; }
  .gift { text-align: center; background: #fff8e1; border: 2px solid #f1dfb2; border-radius: var(--radius); padding: 10px; margin: 8px 0; }
  .gift .stk { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .gift .face { width: 96px; height: 96px; font-size: 3.4rem; animation: pop .6s both; }
  .sgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (min-width: 560px) { .sgrid { grid-template-columns: repeat(4, 1fr); } }
  .sticker { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 10px 6px; text-align: center; }
  .face { width: 84px; height: 84px; margin: 0 auto 4px; border-radius: 50%; display: grid; place-items: center;
    font-size: 3rem; line-height: 1; background: var(--c, #e6f1ff); border: 4px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
  .sticker b { display: block; font-size: .95rem; line-height: 1.2; }
  .sticker small { display: block; font-size: .8rem; opacity: .75; }
  .sticker.locked .face { filter: grayscale(1) brightness(1.1); opacity: .35; }

  /* Confetti */
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
  #fx i { position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 2px; opacity: 0;
    animation: fall var(--t) cubic-bezier(.3,.6,.5,1) forwards; }
  @keyframes fall { 0% { opacity: 1; transform: translate(0,0) rotate(0); }
    100% { opacity: 0; transform: translate(var(--dx), 105vh) rotate(var(--r)); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    #fx { display: none; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="starPath" d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/>
    <symbol id="owl" viewBox="0 0 100 100">
      <path fill="#b7793f" d="M22 30 L26 10 L40 22 Q50 18 60 22 L74 10 L78 30 Q90 48 86 68 Q80 94 50 94 Q20 94 14 68 Q10 48 22 30z"/>
      <path fill="#95602f" d="M16 52 Q6 70 20 84 Q22 66 26 56z M84 52 Q94 70 80 84 Q78 66 74 56z"/>
      <ellipse fill="#f6dcb4" cx="50" cy="70" rx="22" ry="20"/>
      <circle fill="#fff" cx="37" cy="42" r="13"/><circle fill="#fff" cx="63" cy="42" r="13"/>
      <circle fill="#1f2a44" cx="39" cy="43" r="6"/><circle fill="#1f2a44" cx="61" cy="43" r="6"/>
      <circle cx="41" cy="40" r="2" fill="#fff"/><circle cx="63" cy="40" r="2" fill="#fff"/>
      <path fill="#f2a33a" d="M45 54 L55 54 L50 62z"/>
    </symbol>
  </defs>
</svg>
<main>
  <!-- Home -->
  <section id="home">
    <div class="hero">
      <svg class="mascot" data-mood="happy" viewBox="0 0 100 100" aria-hidden="true"><use href="#owl"/><path class="m smile" d="M42 66 Q50 74 58 66"/></svg>
      <div>
        <h1>Phonics Fun</h1>
        <p class="sub">Learn letter sounds with Kiki</p>
      </div>
    </div>
    <div class="pills">
      <span class="pill" title="Stars"><span class="ic" aria-hidden="true">⭐</span><span id="homeStars">0</span> stars</span>
      <span class="pill" title="Days in a row"><span class="ic" aria-hidden="true">🔥</span><span id="homeDays">0</span> days</span>
      <span class="pill" title="Stickers"><span class="ic" aria-hidden="true">🐳</span><span id="homeStk">0/12</span> stickers</span>
    </div>
    <div class="menu">
      <button type="button" class="card hero-card" data-go="map" style="--c: var(--c-orange)">
        <span class="badge" aria-hidden="true">🗺️</span>
        <span><b>Adventure</b><br><small id="homeNext">Start with s a t p i n</small></span>
      </button>
      <button type="button" class="card" data-go="sounds" style="--c: var(--c-pink)">
        <span class="badge" aria-hidden="true">s</span><b>Sounds</b><small>Tap to hear each sound</small></button>
      <button type="button" class="card" data-go="blend" style="--c: var(--c-blue)">
        <span class="badge" aria-hidden="true">cat</span><b>Blending</b><small>c-a-t, cat!</small></button>
      <button type="button" class="card hero-card" data-go="stickers" style="--c: var(--c-teal)">
        <span class="badge" aria-hidden="true">🐢</span>
        <span><b>My Stickers</b><br><small>Collect stars for sea friends</small></span>
      </button>
    </div>
    <p class="note" id="voiceNote" hidden>This device has no English voice. Recorded sounds still play where available.</p>
    <p class="note"><a href="../">← More apps in Cendekia</a></p>
  </section>

  <!-- Adventure map -->
  <section id="map" hidden>
    <div class="bar">
      <button type="button" class="btn ghost" data-go="home">← Back</button>
      <h2>Adventure</h2>
      <span class="pill"><span class="ic" aria-hidden="true">⭐</span><span id="mapStars">0</span></span>
    </div>
    <div class="map" id="mapNodes"></div>
    <p class="note"><button type="button" class="btn ghost" id="resetMap">Start the adventure again</button></p>
  </section>

  <!-- Sounds -->
  <section id="sounds" hidden>
    <div class="bar">
      <button type="button" class="btn ghost" data-go="home">← Back</button>
      <h2>Sounds</h2><span class="spacer"></span>
    </div>
    <div class="stage">
      <div class="big" id="sBig">s</div>
      <div class="row"><span class="pic" id="sPic" aria-hidden="true"></span><span class="name" id="sWord"></span>
        <button type="button" class="btn round" id="sPlay" aria-label="Play the sound">🔊</button></div>
    </div>
    <div class="grid" id="sGrid"></div>
  </section>

  <!-- Blending -->
  <section id="blend" hidden>
    <div class="bar">
      <button type="button" class="btn ghost" data-go="home">← Back</button>
      <h2>Blending</h2><span class="spacer"></span>
    </div>
    <p class="note">Tap a card: Kiki says each sound, then the whole word.</p>
    <div class="wgrid" id="wGrid"></div>
  </section>

  <!-- Quiz -->
  <section id="quiz" hidden>
    <div class="bar">
      <button type="button" class="btn ghost" id="qBack">← Map</button>
      <div class="prog" id="prog"></div>
      <div class="combo" id="combo" aria-live="polite"></div>
    </div>
    <div class="coach">
      <svg class="mascot" id="coachMascot" data-mood="happy" viewBox="0 0 100 100" aria-hidden="true"><use href="#owl"/><path class="m smile" d="M42 66 Q50 74 58 66"/><path class="m oops" d="M43 70 Q50 64 57 70"/></svg>
      <div class="bubble" id="say" aria-live="polite"></div>
    </div>
    <div class="stage">
      <div class="ask" id="ask"></div>
    </div>
    <div id="answers"></div>
  </section>

  <!-- Result -->
  <section id="result" hidden>
    <div class="stack">
      <div class="hero"><svg class="mascot" data-mood="cheer" viewBox="0 0 100 100" aria-hidden="true"><use href="#owl"/><path class="m smile" d="M42 66 Q50 74 58 66"/></svg></div>
      <h2 id="rTitle">Great!</h2>
      <div class="stars" id="rStars"></div>
      <p class="summary" id="rText"></p>
      <div class="gift" id="rGift" hidden></div>
      <button type="button" class="btn alt" id="rNext">Next</button>
      <button type="button" class="btn" id="rAgain">Play again</button>
      <button type="button" class="btn ghost" data-go="map">To the map</button>
    </div>
  </section>

  <!-- Stickers -->
  <section id="stickers" hidden>
    <div class="bar">
      <button type="button" class="btn ghost" data-go="home">← Back</button>
      <h2>My Stickers</h2>
      <span class="pill"><span class="ic" aria-hidden="true">⭐</span><span id="stkStars">0</span></span>
    </div>
    <p class="note" id="stkNext"></p>
    <div class="sgrid" id="sgrid"></div>
  </section>
</main>
<div id="fx" aria-hidden="true"></div>

<!-- Content. tools/make-audio.mjs reads this block to record every sound, word and phrase. -->
<script type="application/json" id="content">
{
  "sounds": [
    { "g": "s", "cut": "fric", "from": "sun", "key": "sun", "pic": "☀️" },
    { "g": "a", "cut": "vowel", "from": "apple", "key": "apple", "pic": "🍎" },
    { "g": "t", "say": "tuh", "key": "tiger", "pic": "🐯" },
    { "g": "p", "say": "puh", "key": "pig", "pic": "🐷" },
    { "g": "i", "cut": "vowel", "from": "it", "key": "insect", "pic": "🐞" },
    { "g": "n", "cut": "son", "from": "nap", "key": "nose", "pic": "👃" },
    { "g": "m", "cut": "son", "from": "mat", "key": "mouse", "pic": "🐭" },

<script>
(() => {
  'use strict';
  const C = JSON.parse(document.getElementById('content').textContent);

  const SECTIONS = ['home', 'map', 'sounds', 'blend', 'quiz', 'result', 'stickers'];
  function show(id) {
    SECTIONS.forEach((s) => { $(s).hidden = s !== id; });
    stopSound(); clearTimeout(replayTimer); window.scrollTo(0, 0);
    if (id === 'home') renderHome();
    if (id === 'map') renderMap();
    if (id === 'stickers') renderStickers();
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-go]');
    if (b) show(b.dataset.go);
  });

  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sample = (a) => a[Math.floor(Math.random() * a.length)];
  const take = (pool, n, not) => shuffle(pool.filter((x) => !not || !not.includes(x))).slice(0, n);

  // ---- Content helpers ----
  const SOUND = {};
  C.sounds.forEach((s) => { SOUND[s.g] = s; });
  // "ll" in shell is not taught as its own sound; it plays as l.
  const soundOf = (g) => SOUND[g] || SOUND[g[0]];
  C.words.forEach((w) => { w.text = w.g.join(''); });
  const wordsIn = (...sets) => C.words.filter((w) => sets.includes(w.set));

  // ---- Sound ----
  // A word or phrase plays audio/<slug>.mp3 and a letter sound plays audio/sound-<letters>.mp3.
  // Without a recording, the device's English voice reads the text.
  const AUDIO_BASE = 'audio/';
  const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const phrase = (text) => ({ file: slug(text), text });
  const phon = (g) => { const s = soundOf(g); return { file: 'sound-' + s.g, text: s.say || s.g }; };
  let ac = null, enVoice = null, current = null, token = 0;
  function audioCtx() {
    if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freqs, dur, type) {
    const c = audioCtx(); if (!c) return;
    freqs.forEach((f, i) => {
      const t0 = c.currentTime + i * dur, o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.18, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur);
    });
  }
  const sfx = { good() { tone([660, 880], 0.12); }, bad() { tone([220], 0.25, 'triangle'); },
                tap() { tone([520], 0.06); }, win() { tone([523, 659, 784, 1047], 0.14); } };

  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    enVoice = speechSynthesis.getVoices().find((v) => /^en/i.test(v.lang)) || null;
    $('voiceNote').hidden = !!enVoice;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); }

  function stopSound() {
    token++;
    if (current) { current.pause(); current = null; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }
  // Plays one item ({file, text} or a plain phrase); `then` runs when it ends (and not if another sound started first).
  function speak(item, then) {
    if (typeof item === 'string') item = phrase(item);
    stopSound();
    const my = token;
    const done = () => { if (my === token && then) then(); };
    const fallback = () => {
      if (my !== token) return;
      if (!('speechSynthesis' in window)) { setTimeout(done, 400); return; }
      // A short delay after cancel() avoids dropped utterances in some browsers.
      setTimeout(() => {
        const u = new SpeechSynthesisUtterance(item.text);
        u.lang = 'en-US'; if (enVoice) u.voice = enVoice; u.rate = 0.85;
        u.onend = done;
        speechSynthesis.speak(u);
      }, 60);
    };
    const a = new Audio(AUDIO_BASE + item.file + '.mp3');
    current = a;
    a.addEventListener('error', fallback, { once: true });
    a.addEventListener('ended', done);
    const p = a.play();
    if (p && p.catch) p.catch((e) => { if (!a.error && e && e.name === 'NotAllowedError') return; fallback(); });
  }
  // Plays items one after another. onStep(k) runs as item k starts and onStep(-1) after the last one,
  // then `then` runs.
  function speakSeq(list, onStep, gap, then) {
    const run = (k) => {
      if (onStep) onStep(k < list.length ? k : -1);
      if (k >= list.length) { if (then) then(); return; }
      const my = token + 1; // speak() bumps the token once
      speak(list[k], () => setTimeout(() => { if (my === token) run(k + 1); }, gap || 120));

  const dayStr = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  function streakNow() {
    const y = new Date(); y.setDate(y.getDate() - 1);
    return S.day === dayStr(new Date()) || S.day === dayStr(y) ? S.streak : 0;
  }
  // Counts today as a learning day; the streak grows when yesterday was one too.
  function markDay() {
    const today = dayStr(new Date());
    if (S.day === today) return;

  // ---- Stickers: sea friends, unlocked by the total star count ----
  const STICKERS = [

    { at: 21, name: 'Clownfish', pic: '🐠', c: '#fff1c2' }, { at: 28, name: 'Whale', pic: '🐳', c: '#d6ebff' },
    { at: 36, name: 'Seal', pic: '🦭', c: '#eceff3' }, { at: 45, name: 'Shrimp', pic: '🦐', c: '#ffe7cc' },
    { at: 55, name: 'Pufferfish', pic: '🐡', c: '#fff1c2' }, { at: 66, name: 'Shark', pic: '🦈', c: '#e6ecf5' },
    { at: 78, name: 'Lobster', pic: '🦞', c: '#ffe0ec' }, { at: 90, name: 'Penguin', pic: '🐧', c: '#ece6ff' }
  ];
  const unlocked = () => STICKERS.filter((k) => k.at <= S.stars).length;
  const face = (k) => '<span class="face" style="--c:' + k.c + '" aria-hidden="true">' + k.pic + '</span>';

  // ---- Adventure stages ----
  const G = (list) => list.map((g) => SOUND[g]);
  const STAGES = [
    { id: 'satpin', title: 's a t p i n', icon: 's', c: 'var(--c-pink)', kind: 'sound', pool: G(['s', 'a', 't', 'p', 'i', 'n']) },
    { id: 'mdgock', title: 'm d g o c k', icon: 'm', c: 'var(--c-orange)', kind: 'sound', pool: G(['m', 'd', 'g', 'o', 'c', 'k']) },
    { id: 'eurhbfl', title: 'e u r h b f l', icon: 'e', c: 'var(--c-purple)', kind: 'sound', pool: G(['e', 'u', 'r', 'h', 'b', 'f', 'l']) },
    { id: 'jvwxyzqu', title: 'j v w x y z qu', icon: 'qu', c: 'var(--c-blue)', kind: 'sound', pool: G(['j', 'v', 'w', 'x', 'y', 'z', 'qu']) },
    { id: 'blend1', title: 'First words', icon: '🐱', c: 'var(--c-teal)', kind: 'word', pool: wordsIn(1), types: ['blend', 'hearWord'] },
    { id: 'blend2', title: 'More words', icon: '🚌', c: 'var(--c-green)', kind: 'word', pool: wordsIn(2), types: ['blend', 'hearWord'] },
    { id: 'spell', title: 'Spell it', icon: '🧩', c: 'var(--c-orange)', kind: 'word', pool: wordsIn(1, 2), types: ['build'] },
    { id: 'digraph', title: 'sh ch th ck', icon: 'sh', c: 'var(--c-pink)', kind: 'sound', pool: G(['sh', 'ch', 'th', 'ck']) },
    { id: 'dwords', title: 'Two letters, one sound', icon: '🚢', c: 'var(--c-purple)', kind: 'word', pool: wordsIn(3), types: ['blend', 'build'] },
    { id: 'long', title: 'ee and oo', icon: '🐝', c: 'var(--c-blue)', kind: 'word', pool: wordsIn(4), types: ['blend', 'build'] },
    { id: 'sentence', title: 'Sentences', icon: '📝', c: 'var(--c-teal)', kind: 'sentence', pool: C.sentences }
  ];
  // A stage opens once the one before it has at least one star.
  const isOpen = (i) => i === 0 || (S.best[STAGES[i - 1].id] || 0) > 0;
  const nextStage = () => { const i = STAGES.findIndex((s) => !S.best[s.id]); return i < 0 ? -1 : i; };

  function renderHome() {

  function renderMap() {
    $('mapStars').textContent = S.stars;
    const box = $('mapNodes'); box.innerHTML = '';
    const nx = nextStage();
    const xs = ['0px', '-70px', '-90px', '-40px', '40px', '90px', '70px'];

      const open = isOpen(i), best = S.best[s.id] || 0;

    const out = [];

  }

  function soundsUpTo(i) {
    const seen = [];
    STAGES.slice(0, i + 1).forEach((s) => { if (s.kind === 'sound') s.pool.forEach((x) => { if (!seen.includes(x)) seen.push(x); }); });
    return seen;
  }
  function makeQuestions(s, i) {
    if (s.kind === 'sound') {
      const known = soundsUpTo(i);
      return spread(s.pool, ROUNDS).map((x, k) => {
        // Every other question asks for the first sound of a picture word; sounds at the end of words (x, ck) never do.
        const type = k % 2 && !x.end ? 'firstSound' : 'pickSound';
        const opts = [x];
        const add = (pool, n) => shuffle(pool.slice()).forEach((y) => {
          if (opts.length < n && !opts.some((o) => twins(o).includes(y))) opts.push(y);
        });
        add(s.pool, 3); add(known, 4);
        return { type, target: x, opts: shuffle(opts) };
      });
    }
    if (s.kind === 'word') {
      return spread(s.pool, ROUNDS).map((w, k) => {
        const type = s.types[k % s.types.length];
        if (type === 'build') {
          const extra = take([...new Set(s.pool.flatMap((x) => x.g))], 2, w.g);
          return { type, target: w, tiles: shuffle(w.g.concat(extra)) };
        }
        // Words that share the most letters with the answer make the closest wrong options.
        const near = s.pool.filter((x) => x !== w).map((x) => ({ x, n: x.g.filter((g, j) => w.g[j] === g).length + Math.random() }))
          .sort((p, q) => q.n - p.n).map((p) => p.x);
        return { type, target: w, opts: shuffle([w, ...(type === 'hearWord' ? near.slice(0, 3) : take(s.pool, 3, [w]))]) };
      });
    }
    return spread(s.pool, ROUNDS).map((t) => ({ type: 'sentence', target: t, opts: shuffle([t, ...take(s.pool, 2, [t])]) }));
  }

  function startStage(i) {
    stageIdx = i; stage = STAGES[i];
    qs = makeQuestions(stage, i); qi = 0; mistakes = 0; combo = 0;
    $('prog').innerHTML = '<i></i>'.repeat(ROUNDS);
    $('combo').textContent = '';
    show('quiz');
    audioCtx();
    // The instruction is read once per round; after that only the question itself is played.
    renderQ(true);
  }

  function optButton(cls, text, isOk, onPick) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt' + (cls ? ' ' + cls : '');
    b.textContent = text;
    if (isOk) b.dataset.ok = '1'; // lets the hint find the right option
    b.addEventListener('click', () => onPick(b));
    return b;
  }
  function speakerBtn(onClick, label) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn round'; b.textContent = '🔊';
    b.setAttribute('aria-label', label || 'Listen again');
    b.addEventListener('click', onClick);
    return b;
  }

  // Returns a function that moves to the next question once. It also fires on its own after a few seconds,
  // in case a sound never reports that it ended. Nothing happens if the child already left this question.
  let serial = 0;
  function advance() {
    const my = serial;
    let done = false;
    const go = () => {
      if (done || my !== serial || $('quiz').hidden) return;
      done = true; qi++;
      if (qi < qs.length) renderQ(false); else finish();
    };
    setTimeout(go, 7000);
    return go;
  }

  const HINTS = { pickSound: 'Listen, then pick', firstSound: 'What sound does it start with?', blend: 'Read, then pick the picture',
    hearWord: 'Listen, then pick the word', build: 'Spell the word', sentence: 'Read, then pick the picture' };

  function renderQ(first) {
    const q = qs[qi];
    serial++; wrongThis = false; wrongTries = 0; locked = false;
    const ask = $('ask'), ans = $('answers');
    ask.innerHTML = ''; ans.innerHTML = '';
    mood('happy', HINTS[q.type]);
    const intro = P[q.type];
    const lead = (sound) => { if (first) speakSeq([intro, sound], null, 250); else speak(sound); };
    const grid = document.createElement('div'); grid.className = 'opts';
    const next = (go) => setTimeout(go, 900);

    if (q.type === 'pickSound' || q.type === 'firstSound') {
      const x = q.target;
      const sound = q.type === 'pickSound' ? phon(x.g) : phrase(x.key);
      if (q.type === 'firstSound') {
        const pic = document.createElement('div'); pic.className = 'pic'; pic.textContent = x.pic;
        pic.setAttribute('aria-hidden', 'true');
        ask.append(pic);
      }
      ask.append(speakerBtn(() => speak(sound)));
      q.opts.forEach((o) => grid.appendChild(optButton('', o.g, o === x, (b) => answer(b, o === x, grid, () => speak(sound), (go) => {
        // After a right answer to "first sound", the sound and the word play together: "sss, sun".
        if (q.type === 'firstSound') speakSeq([phon(x.g), phrase(x.key)], null, 250, go); else next(go);
      }))));
      ans.appendChild(grid);
      lead(sound);
      return;
    }

    if (q.type === 'blend') {
      const w = q.target;
      const word = document.createElement('div'); word.className = 'big';
      word.innerHTML = gHtml(w); fillG(word, w);
      const help = speakerBtn(() => soundTalk(w, word), 'Sound it out');
      help.hidden = true;
      ask.append(word, help);
      q.opts.forEach((o) => grid.appendChild(optButton('pic', o.pic, o === w, (b) => {
        // After a miss, the speaker appears so the child can hear the word sounded out.
        if (o !== w) help.hidden = false;
        answer(b, o === w, grid, null, (go) => setTimeout(() => soundTalk(w, word, go), 400));
      })));
      ans.appendChild(grid);
      if (first) speak(intro);
      return;
    }

    if (q.type === 'hearWord') {
      const w = q.target;
      const play = () => speak(w.text);
      ask.append(speakerBtn(play));
      q.opts.forEach((o) => grid.appendChild(optButton('', o.text, o === w, (b) => answer(b, o === w, grid, play, next))));
      ans.appendChild(grid);
      lead(w.text);
      return;
    }

    if (q.type === 'build') {
      const w = q.target;
      const pic = document.createElement('div'); pic.className = 'pic'; pic.textContent = w.pic;
      pic.setAttribute('aria-hidden', 'true');
      const play = () => speak(w.text);
      const slots = document.createElement('div'); slots.className = 'slots';
      w.g.forEach(() => { const s = document.createElement('span'); s.className = 'slot'; slots.appendChild(s); });
      ask.append(pic, slots, speakerBtn(play));
      const tiles = document.createElement('div'); tiles.className = 'tiles';
      let pos = 0;
      q.tiles.forEach((t) => tiles.appendChild(optButton('', t, false, (b) => {
        if (locked) return;
        if (t !== w.g[pos]) {
          miss(b, play);
          // From the second miss on, the right tile blinks.
          if (wrongTries >= 2) {
            const right = [...tiles.children].find((x) => x.textContent === w.g[pos] && !x.classList.contains('used'));
            if (right) right.classList.add('hint');
          }
          return;
        }
        [...tiles.children].forEach((x) => x.classList.remove('hint'));
        slots.children[pos].textContent = t; slots.children[pos].classList.add('full');
        b.classList.add('used'); pos++;
        if (pos < w.g.length) { sfx.tap(); speak(phon(t)); return; }
        locked = true;
        solved();
        const go = advance();
        setTimeout(() => soundTalk(w, slots, go), 300);
      })));
      ans.appendChild(tiles);
      lead(w.text);
      return;
    }

    // Sentence: each word can be tapped to hear it, and the speaker reads along word by word.
    const t = q.target, words = t.text.split(' ');
    const line = document.createElement('div'); line.className = 'sentence';
    words.forEach((wd) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'word'; b.textContent = wd;
      b.addEventListener('click', () => speak(wd));
      line.appendChild(b);
    });
    const readAlong = (then) => speakSeq(words.concat(t.text), (k) => {
      [...line.children].forEach((x, j) => x.classList.toggle('lit', k === j || k === words.length));
    }, 150, then);
    ask.append(line, speakerBtn(() => readAlong(), 'Read with me'));
    grid.className = 'opts three';
    q.opts.forEach((o) => grid.appendChild(optButton('pic', o.pic, o === t, (b) => answer(b, o === t, grid, null, (go) => readAlong(go)))));
    ans.appendChild(grid);
    if (first) speak(intro);
  }

  let replayTimer = 0; // a replay after a miss, cancelled once the question is solved
  function miss(b, replay) {
    b.classList.remove('no'); void b.offsetWidth; b.classList.add('no');
    sfx.bad();
    if (!wrongThis) { wrongThis = true; mistakes++; }
    wrongTries++; combo = 0; $('combo').textContent = '';
    mood('oops', sample(P.retry));
    clearTimeout(replayTimer);
    if (replay) replayTimer = setTimeout(replay, 450);
  }
  function solved() {
    clearTimeout(replayTimer);
    sfx.good();
    if (!wrongThis) combo++;
    $('combo').textContent = combo >= 3 ? '🔥 ' + combo : '';
    const p = sample(C.cheers); // shown in the bubble only, a right answer is not read aloud
    mood('cheer', combo >= 3 ? p + ' ' + combo + ' in a row!' : p);
    if (combo >= 3) confetti(14);
    $('prog').children[qi].classList.add('done');
  }
  // `after(go)` plays the closing sound for the question and calls go() to move on.
  function answer(b, ok, grid, replay, after) {
    if (locked) return;
    if (!ok) {
      miss(b, replay);
      if (wrongTries >= 2) [...grid.children].forEach((x) => { if (x.dataset.ok) x.classList.add('hint'); });
      return;
    }
    locked = true;
    [...grid.children].forEach((x) => x.classList.remove('hint'));
    b.classList.add('ok');
    solved();
    after(advance());
  }

  function finish() {
    const stars = mistakes <= 1 ? 3 : mistakes <= 3 ? 2 : 1;
    const before = unlocked();
    S.stars += stars;
    S.best[stage.id] = Math.max(S.best[stage.id] || 0, stars);
    markDay(); save();
    const gained = STICKERS.slice(before, unlocked());
    show('result');
    $('rTitle').textContent = stars === 3 ? 'Amazing!' : stars === 2 ? 'Great job!' : 'Good try, keep practising!';
    $('rStars').innerHTML = [1, 2, 3].map((k) => starSvg(k <= stars, 'star')).join('');
    const days = streakNow();
    $('rText').textContent = (ROUNDS - mistakes) + ' of ' + ROUNDS + ' right on the first try. ' +
      'You got ' + stars + (stars === 1 ? ' star. ' : ' stars. ') + '🔥 ' + days + (days === 1 ? ' day' : ' days') + ' in a row.';
    const g = $('rGift');
    g.hidden = !gained.length;
    if (gained.length) g.innerHTML = '<b>New sticker!</b><div class="stk">' + gained.map(face).join('') + '</div><small>' + gained.map((k) => k.name).join(', ') + '</small>';
    $('rNext').hidden = stageIdx + 1 >= STAGES.length;
    sfx.win(); confetti(stars * 25 + (gained.length ? 40 : 0));
  }
  $('rNext').addEventListener('click', () => startStage(stageIdx + 1));
  $('rAgain').addEventListener('click', () => startStage(stageIdx));
  $('qBack').addEventListener('click', () => show('map'));

  function renderStickers() {
    $('stkStars').textContent = S.stars;
    const nx = STICKERS.find((k) => k.at > S.stars);
    $('stkNext').textContent = nx ? 'Collect ' + (nx.at - S.stars) + ' more ' + (nx.at - S.stars === 1 ? 'star' : 'stars') + ' for the next sticker.' : 'You collected every sticker. Amazing!';
    $('sgrid').innerHTML = '';
    STICKERS.forEach((k) => {
      const d = document.createElement('div');
      const open = k.at <= S.stars;
      d.className = 'sticker' + (open ? '' : ' locked');
      d.innerHTML = face(k) + '<b></b><small></small>';
      d.querySelector('b').textContent = open ? k.name : '???';
      d.querySelector('small').textContent = open ? 'Collected' : '⭐ ' + k.at;
      $('sgrid').appendChild(d);
    });
  }

  renderHome();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
<script data-goatcounter="https://megawan.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
