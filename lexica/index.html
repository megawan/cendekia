<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lexica</title>
<meta name="theme-color" content="#0e9aa7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="A simple game for Indonesian-speaking children to learn English words: animals, fruit, the body, colors and more, all read aloud in both languages.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eefaf6; --ink: #1f2a44; --card: #ffffff; --line: #c9e8e0;
    --accent: #0e9aa7; --accent-d: #0a7680; --warm: #f2a33a; --warm-d: #c2801f; --good: #1f9d6b; --bad: #d9534f;
    --c-green: #1f9d6b; --c-orange: #f2891f; --c-pink: #e0558a; --c-purple: #7a5af8; --c-blue: #2e90fa; --c-teal: #0e9aa7;
    --radius: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  .homeTop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .who { display: flex; justify-content: flex-end; }
  html, body { margin: 0; min-height: 100%; color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif; touch-action: manipulation; }
  /* The glow sits on a fixed layer instead of a fixed background, which repaints with visible bands on overscroll. */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(circle at 10% 6%, #fff1c2 0, transparent 36%),
                radial-gradient(circle at 92% 24%, #ffe0ec 0, transparent 34%),
                radial-gradient(circle at 50% 100%, #d9f5e8 0, transparent 40%); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 1.9rem; margin: 4px 0 0; line-height: 1.1; }
  h2 { font-size: clamp(1.15rem, 5vw, 1.4rem); margin: 0; text-align: center; flex: 1; white-space: nowrap; }
  .sub { margin: 0; opacity: .8; }
  .btn { font: inherit; font-weight: 700; font-size: 1.15rem; border: 0; border-radius: var(--radius);
    padding: 14px 22px; background: var(--accent); color: #fff; cursor: pointer;
    box-shadow: 0 5px 0 var(--accent-d); min-height: 56px; transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-d); }
  .btn.alt { background: var(--warm); box-shadow: 0 5px 0 var(--warm-d); }
  .btn.ghost { background: rgba(255,255,255,.75); color: var(--ink); box-shadow: none; border: 2px solid var(--line); }
  .btn.round { width: 64px; min-height: 64px; padding: 0; border-radius: 50%; font-size: 1.8rem; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--c-purple); outline-offset: 2px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .bar .btn { padding: 8px 16px; min-height: 46px; font-size: 1rem; box-shadow: none; }
  .bar .spacer { width: 46px; }
  .stack { display: grid; gap: 14px; max-width: 420px; margin: 20px auto; }
  .center { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .note { font-size: .9rem; text-align: center; opacity: .75; margin-top: 12px; }
  .note a { color: inherit; }

  /* Home */
  .hero { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 4px 0 10px; }
  .hero .mascot { width: 104px; height: 104px; animation: bob 3s ease-in-out infinite; }
  .pills { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 2px solid var(--line);
    border-radius: 999px; padding: 4px 14px 4px 10px; font-weight: 700; }
  .pill .ic { font-size: 1.2rem; line-height: 1; }
  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { --c: var(--c-blue); position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
    text-align: center; background: var(--card); border: 2px solid var(--line); border-bottom: 6px solid var(--c);
    border-radius: var(--radius); padding: 14px 8px 12px; font: inherit; color: inherit; cursor: pointer;
    transition: transform .1s; }
  .card:active { transform: translateY(3px); }
  .card .badge { width: 62px; height: 62px; border-radius: 50%; background: var(--c); color: #fff;
    display: grid; place-items: center; font-size: 1.8rem; font-weight: 800; line-height: 1; }
  .card b { font-size: 1.15rem; line-height: 1.2; }
  .card small { font-size: .85rem; opacity: .75; line-height: 1.2; }
  .card.hero-card { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 16px; padding: 18px 12px; }
  .card.hero-card .badge { width: 76px; height: 76px; font-size: 2.4rem; }
  .card.hero-card b { font-size: 1.5rem; }
  .card.hero-card span:last-child { text-align: left; }

  /* Mascot: Pochi the parrot */
  .mascot { display: block; }
  .mascot .m { display: none; fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
  .mascot[data-mood="happy"] .m.smile, .mascot[data-mood="cheer"] .m.smile, .mascot[data-mood="oops"] .m.oops { display: block; }
  @keyframes hop { 30% { transform: translateY(-14px) scale(1.08); } }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes pop { 40% { transform: scale(1.08); } }
  @keyframes blink { 50% { background: #fff1d6; } }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  .coach { display: flex; align-items: center; gap: 10px; text-align: left; margin-bottom: 8px; min-height: 64px; }
  .coach .mascot { width: 64px; height: 64px; flex: none; }
  .bubble { position: relative; background: #fff8e1; border: 2px solid #f1dfb2; border-radius: 16px;
    padding: 6px 14px; font-weight: 700; font-size: 1.1rem; }
  .bubble::before { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -8px; width: 14px; height: 14px;
    background: #fff8e1; border-left: 2px solid #f1dfb2; border-bottom: 2px solid #f1dfb2; transform: rotate(45deg); }


  /* Explore: cards */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(7, 1fr); } }
  .tile { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 6px 0 8px; text-align: center; cursor: pointer; font: inherit; color: inherit; font-size: 1.8rem;
    font-weight: 800; transition: transform .1s; min-height: 64px; }
  .tile:active { transform: scale(.95); }
  .tile.on { border-color: var(--accent); background: #dff5f3; }
  .tile small { display: block; font-size: .8rem; font-weight: 500; opacity: .75; }
  #cards { perspective: 1000px; }
  .stage { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 16px; text-align: center; margin-bottom: 14px; }
  .stage .big { font-size: 5.5rem; font-weight: 800; line-height: 1.05; }
  .stage .pic { font-size: 4rem; line-height: 1.2; }
  .stage .name { font-size: 1.5rem; font-weight: 700; }
  .stage .row { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .wgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 560px) { .wgrid { grid-template-columns: repeat(3, 1fr); } }
  .wcard { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 10px 6px;
    font: inherit; color: inherit; cursor: pointer; text-align: center; }
  .wcard .pic { font-size: 2.8rem; line-height: 1.2; display: block; }
  .wcard .w { font-size: 1.5rem; font-weight: 800; }
  .slot.lit { background: var(--warm); color: #fff; }

  /* Quiz */
  .prog { display: flex; gap: 4px; flex: 1; }
  .prog i { flex: 1; height: 12px; border-radius: 6px; background: var(--line); transition: background .3s; }
  .prog i.done { background: var(--good); }
  .combo { min-width: 64px; text-align: center; font-weight: 800; color: var(--c-orange); }
  .ask { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ask .big { font-size: 4.5rem; font-weight: 800; line-height: 1.1; }
  .ask .pic { font-size: 4.5rem; line-height: 1.15; }
  .sentence { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px; font-size: 2.4rem; font-weight: 800; line-height: 1.2; }
  .word { font: inherit; color: inherit; background: none; border: 0; border-bottom: 3px dotted var(--line);
    border-radius: 8px; padding: 0 4px; cursor: pointer; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opts.three { grid-template-columns: 1fr 1fr 1fr; }
  .opt { background: var(--card); border: 3px solid var(--line); border-bottom-width: 6px; border-radius: var(--radius);
    min-height: 110px; padding: 8px 4px; font: inherit; font-size: 2.6rem; font-weight: 800; color: inherit; cursor: pointer;
    transition: transform .08s; line-height: 1.1; }
  .opt.pic { font-size: 3.4rem; }
  /* Word options: long English words (watermelon, helicopter) must fit two to a row on a phone. */
  .opt.txt { font-size: clamp(1.15rem, 5.4vw, 1.7rem); min-height: 84px; overflow-wrap: anywhere; }
  .themes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 560px) { .themes { grid-template-columns: repeat(3, 1fr); } }
  .theme { --c: var(--c-blue); display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; color: inherit; cursor: pointer;
    background: var(--card); border: 2px solid var(--line); border-bottom: 6px solid var(--c); border-radius: var(--radius); padding: 10px 6px 8px; }
  .theme:active { transform: translateY(3px); }
  .theme .ico { font-size: 2.4rem; line-height: 1.2; }
  .theme b { font-size: 1.05rem; line-height: 1.2; text-align: center; }
  .theme .st { display: flex; gap: 2px; }
  .theme .st svg { width: 20px; height: 20px; fill: var(--line); }
  .theme .st svg.on { fill: var(--warm); }
  .theme.next { animation: bounce 1.4s ease-in-out infinite; box-shadow: 0 0 0 4px rgba(242,163,58,.4); }
  /* Drawings and figures that stand in for an emoji. */
  svg.art { width: 1em; height: 1em; vertical-align: -.12em; }
  svg.fig { height: 8.5rem; width: auto; vertical-align: top; }
  svg.fig.tall { height: 11.5rem; }
  .wcard .pic svg.fig { height: 4.6rem; }
  .wcard .pic svg.fig.tall { height: 6rem; }
  .word-line { font-size: 1.7rem; font-weight: 800; line-height: 1.2; }
  .word-line.id { color: var(--c-pink); }
  .word-line.big { font-size: 2.8rem; }
  .langs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .lang { font: inherit; color: inherit; cursor: pointer; background: #f4fbf9; border: 2px solid var(--line); border-radius: 16px; padding: 6px 4px; }
  .lang small { display: block; font-size: .8rem; opacity: .7; }
  .lang b { display: block; font-size: 1.5rem; line-height: 1.2; overflow-wrap: anywhere; }
  #cId b { color: var(--c-pink); }
  .wcard.on { border-color: var(--accent); background: #dff5f3; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  .chip { font: inherit; font-size: 1.5rem; min-width: 52px; min-height: 52px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); color: inherit; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent-d); }
  .opts.three .opt { font-size: 2.4rem; }
  .opt:active { transform: translateY(3px); }
  .opt.ok { border-color: var(--good); background: #e8f8f0; animation: pop .35s; }
  .opt.no { border-color: var(--bad); background: #fdeceb; animation: shake .3s; }
  .opt.hint { border-color: var(--warm); animation: blink .8s ease-in-out infinite; }
  .slots { display: flex; justify-content: center; gap: 6px; width: 100%; margin: 6px 0 2px; }
  /* Slots shrink so every letter of a long word stays on screen, even on a narrow or zoomed phone. */
  .slot { flex: 0 1 76px; min-width: 0; height: 76px; border-radius: 16px; border: 3px dashed var(--line); display: grid; place-items: center;
    font-size: clamp(1.5rem, 7vw, 2.2rem); font-weight: 800; background: rgba(255,255,255,.6); }
  .slot.full { border-style: solid; border-color: var(--good); background: #e8f8f0; animation: pop .3s; }
  .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .tiles .opt { min-height: 76px; min-width: 72px; font-size: 2.2rem; }
  .tiles .opt.used { visibility: hidden; }

  /* Result and stickers */
  .stars { display: flex; justify-content: center; gap: 6px; margin: 12px 0; }
  .star { width: 64px; height: 64px; fill: var(--line); }
  .star.on { fill: var(--warm); animation: pop .5s both; }
  .star.on:nth-child(2) { animation-delay: .2s; } .star.on:nth-child(3) { animation-delay: .4s; }
  .summary { text-align: center; font-weight: 700; margin: 8px 0; font-size: 1.15rem; }
  .gift { text-align: center; background: #fff8e1; border: 2px solid #f1dfb2; border-radius: var(--radius); padding: 10px; margin: 8px 0; }
  .gift .stk { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .gift .face { width: 96px; height: 96px; font-size: 3.4rem; animation: pop .6s both; }
  .sgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (min-width: 560px) { .sgrid { grid-template-columns: repeat(4, 1fr); } }
  .sticker { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 10px 6px; text-align: center; }
  .face { width: 84px; height: 84px; margin: 0 auto 4px; border-radius: 50%; display: grid; place-items: center;
    font-size: 3rem; line-height: 1; background: var(--c, #e6f1ff); border: 4px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
  .sticker b { display: block; font-size: .95rem; line-height: 1.2; }
  .sticker small { display: block; font-size: .8rem; opacity: .75; }
  .sticker.locked .face { filter: grayscale(1) brightness(1.1); opacity: .35; }


  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  [hidden] { display: none !important; }
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="starPath" d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/>
    <symbol id="parrot" viewBox="0 0 100 100">
      <path class="crest" fill="#e0558a" d="M42 26 Q34 8 44 4 Q47 14 50 22 Q55 6 64 8 Q63 18 58 28z"/>
      <path fill="#1f9d6b" d="M50 20 Q82 20 88 54 Q90 90 50 94 Q10 90 12 54 Q18 20 50 20z"/>
      <path class="wing-l" fill="#167a53" d="M14 52 Q4 70 18 86 Q22 68 26 58z"/><path class="wing-r" fill="#167a53" d="M86 52 Q96 70 82 86 Q78 68 74 58z"/>
      <ellipse fill="#c8f0d8" cx="50" cy="76" rx="22" ry="17"/>
      <g class="eyes"><circle fill="#fff" cx="36" cy="42" r="12"/><circle fill="#fff" cx="64" cy="42" r="12"/>
      <circle fill="#1f2a44" cx="38" cy="43" r="6"/><circle fill="#1f2a44" cx="62" cy="43" r="6"/>
      <circle cx="40" cy="40" r="2" fill="#fff"/><circle cx="64" cy="40" r="2" fill="#fff"/></g>
      <circle fill="#e0558a" opacity=".35" cx="24" cy="58" r="6"/><circle fill="#e0558a" opacity=".35" cx="76" cy="58" r="6"/>
      <path fill="#f2a33a" d="M43 52 Q50 46 57 52 Q56 62 50 63 Q44 62 43 52z"/>
    </symbol>
  </defs>
</svg>
<main>
  <!-- Home -->
  <section id="home">
    <div class="homeTop"><a class="btn ghost back" href="../" data-id="← Cendekia">← Cendekia</a><div class="who" id="who"></div></div>
    <div class="hero" data-mascot="lexica">
      <svg class="mascot" data-mood="happy" viewBox="0 0 100 100" aria-hidden="true"><use href="#parrot"/><path class="m smile" d="M42 66 Q50 74 58 66"/></svg>
      <div>
        <h1>Lexica</h1>
        <p class="sub" data-id="Indonesia ↔ Inggris bersama Pochi">Indonesian ↔ English with Pochi</p>
      </div>
    </div>
    <div class="pills">
      <span class="pill" title="Stars" data-id-title="Bintang"><span class="ic" aria-hidden="true">⭐</span><span id="homeStars">0</span> <span data-id="bintang">stars</span></span>
      <span class="pill" title="Days in a row" data-id-title="Hari berturut-turut"><span class="ic" aria-hidden="true">🔥</span><span id="homeDays">0</span> <span data-id="hari">days</span></span>
      <span class="pill" title="Stickers collected" data-id-title="Stiker terkumpul"><span class="ic" aria-hidden="true">🦜</span><span id="homeStk">0/12</span> <span data-id="stiker">stickers</span></span>
    </div>
    <div class="menu">
      <button type="button" class="card hero-card" data-go="map" style="--c: var(--c-orange)">
        <span class="badge" aria-hidden="true">🗺️</span>
        <span><b data-id="Petualangan">Adventure</b><br><small id="homeNext" data-id="Pilih tema favoritmu">Pick your favorite theme</small></span>
      </button>
      <button type="button" class="card" data-go="cards" style="--c: var(--c-pink)">
        <span class="badge" aria-hidden="true">🐱</span><b data-id="Kartu kata">Word cards</b><small data-id="Ketuk untuk mendengar kedua bahasa">Tap to hear both languages</small></button>
      <button type="button" class="card" data-go="stickers" style="--c: var(--c-teal)">
        <span class="badge" aria-hidden="true">🦜</span><b data-id="Stikerku">My stickers</b><small data-id="Kumpulkan bintang">Collect stars</small></button>
    </div>
    <p class="note" id="voiceNote" hidden data-id="Perangkat ini belum punya suara bahasa Indonesia atau Inggris. Rekaman tetap diputar jika ada.">This device has no Indonesian or English voice yet. Recordings still play where there are some.</p>
    <p class="note"><a href="../" data-id="← Aplikasi lain di Cendekia">← More apps in Cendekia</a> · <a href="../parents/" data-id="👪 Untuk orang tua">👪 For parents</a></p>
  </section>

  <!-- Adventure map -->
  <section id="map" hidden>
    <div class="bar">
      <button type="button" class="btn ghost" data-go="home" data-id="← Kembali">← Back</button>
      <h2 data-id="Pilih tema">Choose a theme</h2>
      <span class="pill"><span class="ic" aria-hidden="true">⭐</span><span id="mapStars">0</span></span>
    </div>
    <div class="themes" id="mapNodes"></div>
    <p class="note"><button type="button" class="btn ghost" id="resetMap" data-id="Mulai petualangan lagi">Start the adventure again</button></p>
  </section>

  <!-- Cards -->
  <section id="cards" hidden>
    <div class="bar">
      <button type="button" class="btn ghost" data-go="home" data-id="← Kembali">← Back</button>
      <h2 data-id="Kartu kata">Word cards</h2><span class="spacer"></span>
    </div>
    <div class="chips" id="cCats"></div>
    <div class="stage">
      <div class="pic" id="cPic" aria-hidden="true"></div>
      <div class="langs">
        <button type="button" class="lang" id="cId"><small data-id="Indonesia">Indonesian</small><b></b></button>
        <button type="button" class="lang" id="cEn"><small data-id="Inggris">English</small><b></b></button>
      </div>
    </div>
    <div class="wgrid" id="cGrid"></div>
  </section>

  <!-- Quiz -->
  <section id="quiz" hidden>
    <div class="bar">
      <button type="button" class="btn ghost" id="qBack" data-id="← Peta">← Map</button>
      <div class="prog" id="prog"></div>
      <div class="combo" id="combo" aria-live="polite"></div>
    </div>
    <div class="coach">
      <svg class="mascot" id="coachMascot" data-mood="happy" viewBox="0 0 100 100" aria-hidden="true"><use href="#parrot"/><path class="m smile" d="M42 66 Q50 74 58 66"/><path class="m oops" d="M43 70 Q50 64 57 70"/></svg>
      <div class="bubble" id="say" aria-live="polite"></div>
    </div>
    <div class="stage">
      <div class="ask" id="ask"></div>
    </div>
    <div id="answers"></div>
  </section>

  <!-- Result -->
  <section id="result" hidden>
    <div class="stack">
      <div class="hero"><svg class="mascot" data-mood="cheer" viewBox="0 0 100 100" aria-hidden="true"><use href="#parrot"/><path class="m smile" d="M42 66 Q50 74 58 66"/></svg></div>
      <h2 id="rTitle">Great!</h2>
      <div class="stars" id="rStars"></div>
      <p class="summary" id="rText"></p>
      <div class="gift" id="rGift" hidden></div>
      <button type="button" class="btn alt" id="rNext" data-id="Lanjut">Next</button>
      <button type="button" class="btn" id="rAgain" data-id="Main lagi">Play again</button>
      <button type="button" class="btn ghost" data-go="map" data-id="Kembali ke peta">Back to the map</button>
    </div>
  </section>

  };
  const isFig = (w) => w.pic.startsWith('fig:');
  function highlight(parts) {
    const list = Array.isArray(parts[0]) ? parts : [parts];
    return list.map(([cx, cy, rx, ry, rot]) => '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '"' + (rot ? ' transform="rotate(' + rot + ' ' + cx + ' ' + cy + ')"' : '') +

  // ---- Content ----
  // A word is {id, en, pic, cat}. The same English word can sit in two categories (orange the fruit and the colour),

  const WORDS = [];
  C.cats.forEach((c) => { c.list = c.words.map(([id, en, pic]) => ({ id, en, pic, cat: c.id })); WORDS.push(...c.list); });
  const ALL = WORDS.slice();
  const clash = (a, b) => a.en === b.en || a.id === b.id || a.pic === b.pic;
  // Picks wrong options from `pool` that never clash with the answer or with each other.
  function wrong(pool, answer, n) {
    const out = [];

    const near = shuffle(pool.filter((w) => w.cat === answer.cat)), far = shuffle(pool.filter((w) => w.cat !== answer.cat));
    [...near, ...far].forEach((w) => { if (out.length < n && ![answer, ...out].some((o) => clash(o, w))) out.push(w); });
    return out;

  // ---- Sound ----
  // A word or phrase plays audio/<lang>-<slug>.mp3. Without a recording, the device's voice for that language reads the text.
  const AUDIO_BASE = 'audio/';
  const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const say = (lang, text) => ({ lang, text, file: lang + '-' + slug(text) });
  const en = (w) => say('en', w.en), id = (w) => say('id', w.id), idp = (t) => say('id', t);
  let ac = null, voices = {}, current = null, token = 0;
  function audioCtx() {
    if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); }
    if (ac && ac.state === 'suspended') ac.resume();

  }
  function tone(freqs, dur, type) {

      g.gain.setValueAtTime(0.18, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);

    });
  }
  const sfx = { good() { /* a right answer is shown, not sounded: the chime did not sound natural */ }, bad() { tone([220], 0.25, 'triangle'); },
                tap() { tone([520], 0.06); }, win() { /* so is a finished round */ } };

  function pickVoices() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    voices.id = vs.find((v) => /^id/i.test(v.lang)) || null;
    voices.en = vs.find((v) => /^en/i.test(v.lang)) || null;
    $('voiceNote').hidden = !!(voices.id && voices.en);
  }
  if ('speechSynthesis' in window) { pickVoices(); speechSynthesis.addEventListener('voiceschanged', pickVoices); }

  function stopSound() {
    token++;
    if (current) { current.pause(); current = null; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }
  // Plays one item ({lang, text, file}); `then` runs when it ends (and not if another sound started first).
  function speak(item, then) {
    stopSound();
    const my = token;

    const fallback = () => {
      if (my !== token) return;
      if (!('speechSynthesis' in window)) { setTimeout(done, 400); return; }

        const u = new SpeechSynthesisUtterance(item.text);
        u.lang = item.lang === 'id' ? 'id-ID' : 'en-US';

  const dayStr = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  const COLORS = ['var(--c-orange)', 'var(--c-pink)', 'var(--c-purple)', 'var(--c-blue)', 'var(--c-teal)', 'var(--c-green)'];

    { id: 'arti', title: T('Guess the meaning', 'Tebak artinya'), icon: 'A↔B', c: 'var(--c-teal)', pool: ALL, types: ['idEn', 'enId'] },

  // ---- Explore: cards ----

  // ---- Quiz ----
  const ROUNDS = 8;
  let stage = null, stageIdx = 0, qs = [], qi = 0, mistakes = 0, wrongThis = false, wrongTries = 0, combo = 0, locked = false;
  const P = C.phrases;

  function mood(m, text) {
    const el = $('coachMascot');
    el.setAttribute('data-mood', m);
    Cendekia.fx.react(el, m);
    if (text) $('say').textContent = text;
  }

  // Picks n items so every item of the pool shows up before any repeats.
  function spread(pool, n) {
    const out = [];
    while (out.length < n) out.push(...shuffle(pool.slice()));
    return out.slice(0, n);
  }
  function makeQuestions(s) {
    return spread(s.pool, ROUNDS).map((w, k) => {

      if (type === 'spell' && !/^[a-z]{3,8}$/.test(w.en)) type = 'picEn';
      if (type === 'spell') {

  function optButton(cls, text, isOk, onPick, html) {

    b.type = 'button'; b.className = 'btn round'; b.textContent = '🔊';
    b.setAttribute('aria-label', label || T('Listen again', 'Dengarkan lagi'));
    b.addEventListener('click', onClick);
    return b;
  }

  // Returns a function that moves to the next question once. It also fires on its own after a few seconds,
  // in case a sound never reports that it ended. Nothing happens if the child already left this question.
  let serial = 0;
  function advance() {
    const my = serial;
    let done = false;
    const go = () => {
      if (done || my !== serial || $('quiz').hidden) return;
      done = true; qi++;
      if (qi < qs.length) renderQ(false); else finish();
    };
    setTimeout(go, 7000);
    return go;
  }

  // Pochi's instructions stay in Indonesian, the children's own language: they have recordings, like the words.
  const HINTS = { hearEn: 'Dengarkan, lalu pilih', picEn: 'Apa bahasa Inggrisnya?', idEn: 'Apa bahasa Inggrisnya?',
    enId: 'Apa artinya?', spell: 'Susun hurufnya' };

  function renderQ(first) {
    const q = qs[qi], w = q.target;
    serial++; wrongThis = false; wrongTries = 0; locked = false;
    const ask = $('ask'), ans = $('answers');
    ask.innerHTML = ''; ans.innerHTML = '';
    mood('happy', HINTS[q.type]);
    const grid = document.createElement('div'); grid.className = 'opts';
    // After a right answer: the English word, then the Indonesian one, so both sounds are tied to the same picture.
    const close = (go) => setTimeout(() => speakSeq([en(w), id(w)], null, 250, go), 300);
    const lead = (sound) => { if (first) speakSeq([idp(P[q.type]), sound], null, 250); else speak(sound); };
    const pic = () => { const p = document.createElement('div'); p.className = 'pic'; p.innerHTML = picHtml(w); p.setAttribute('aria-hidden', 'true'); return p; };
    const label = (t, cls) => { const d = document.createElement('div'); d.className = 'word-line ' + (cls || ''); d.textContent = t; return d; };

    if (q.type === 'hearEn') {
      const play = () => speak(en(w));
      ask.append(speakerBtn(play));
      q.opts.forEach((o) => grid.appendChild(optButton('pic', picHtml(o), o === w, (b) => answer(b, o === w, grid, play, close), true)));
      ans.appendChild(grid);
      lead(en(w));
      return;
    }
    if (q.type === 'picEn') {
      ask.append(pic(), label(w.id, 'id'));
      q.opts.forEach((o) => grid.appendChild(optButton('txt', o.en, o === w, (b) => answer(b, o === w, grid, () => speak(en(o)), close))));
      ans.appendChild(grid);
      if (first) speak(idp(P.picEn));
      return;
    }
    if (q.type === 'idEn') {
      ask.append(label(w.id, 'id big'), speakerBtn(() => speak(id(w)), T('Hear the Indonesian word', 'Dengarkan kata bahasa Indonesia')));
      q.opts.forEach((o) => grid.appendChild(optButton('txt', o.en, o === w, (b) => answer(b, o === w, grid, () => speak(en(o)), close))));
      ans.appendChild(grid);
      lead(id(w));
      return;
    }
    if (q.type === 'enId') {
      ask.append(label(w.en, 'big'), speakerBtn(() => speak(en(w)), T('Hear the English word', 'Dengarkan kata bahasa Inggris')));
      q.opts.forEach((o) => grid.appendChild(optButton('txt', o.id, o === w, (b) => answer(b, o === w, grid, () => speak(en(w)), close))));
      ans.appendChild(grid);
      lead(en(w));
      return;
    }

    // Spell: tap the letters of the English word in order.
    const play = () => speak(en(w));
    const slots = document.createElement('div'); slots.className = 'slots';
    w.en.split('').forEach(() => { const s = document.createElement('span'); s.className = 'slot'; slots.appendChild(s); });
    ask.append(pic(), label(w.id, 'id'), slots, speakerBtn(play));
    const tiles = document.createElement('div'); tiles.className = 'tiles';
    let pos = 0;
    q.tiles.forEach((t) => tiles.appendChild(optButton('', t, false, (b) => {
      if (locked) return;
      if (t !== w.en[pos]) {
        miss(b, play);
        // From the second miss on, the right tile blinks.
        if (wrongTries >= 2) {
          const right = [...tiles.children].find((x) => x.textContent === w.en[pos] && !x.classList.contains('used'));
          if (right) right.classList.add('hint');
        }
        return;
      }
      [...tiles.children].forEach((x) => x.classList.remove('hint'));
      slots.children[pos].textContent = t; slots.children[pos].classList.add('full');
      b.classList.add('used'); pos++;
      if (pos < w.en.length) { sfx.tap(); return; }
      locked = true;
      solved();
      close(advance());
    })));
    ans.appendChild(tiles);
    lead(en(w));
  }

  let replayTimer = 0; // a replay after a miss, cancelled once the question is solved
  function miss(b, replay) {
    b.classList.remove('no'); void b.offsetWidth; b.classList.add('no');
    sfx.bad();
    if (!wrongThis) { wrongThis = true; mistakes++; Cendekia.weak('kosakata', weakLabel(qs[qi])); }
    wrongTries++; combo = 0; $('combo').textContent = '';
    mood('oops', sample(P.retry));
    clearTimeout(replayTimer);
    if (replay) replayTimer = setTimeout(replay, 450);
  }
  function solved() {
    clearTimeout(replayTimer);
    sfx.good();
    if (!wrongThis) combo++;
    $('combo').textContent = combo >= 3 ? '🔥 ' + combo : '';
    const p = sample(C.cheers); // shown in the bubble only, a right answer is not read aloud
    mood('cheer', combo >= 3 ? p + ' ' + combo + T(' right in a row!', ' benar berturut-turut!') : p);
    if (combo >= 3) Cendekia.fx.confetti(14);
    $('prog').children[qi].classList.add('done');
  }
  // `after(go)` plays the closing sound for the question and calls go() to move on.
  function answer(b, ok, grid, replay, after) {
    if (locked) return;
    if (!ok) {
      miss(b, replay);
      if (wrongTries >= 2) [...grid.children].forEach((x) => { if (x.dataset.ok) x.classList.add('hint'); });
      return;
    }
    locked = true;
    [...grid.children].forEach((x) => x.classList.remove('hint'));
    b.classList.add('ok'); Cendekia.fx.burst(b);
    solved();
    after(advance());
  }

  function finish() {
    const stars = mistakes <= 1 ? 3 : mistakes <= 3 ? 2 : 1;
    Cendekia.round({ app: 'kosakata', stage: stage.title, stars, right: ROUNDS - mistakes, total: ROUNDS, ms: Date.now() - roundStart });
    const before = unlocked();
    S.stars += stars;
    S.best[stage.id] = Math.max(S.best[stage.id] || 0, stars);
    markDay(); save();
    const gained = STICKERS.slice(before, unlocked());
    show('result');
    $('rTitle').textContent = stars === 3 ? T('Amazing!', 'Luar biasa!') : stars === 2 ? T('Great!', 'Hebat!') : T('Good, keep practising!', 'Bagus, terus berlatih ya!');
    $('rStars').innerHTML = [1, 2, 3].map((k) => starSvg(k <= stars, 'star')).join('');
    $('rText').textContent = T((ROUNDS - mistakes) + ' of ' + ROUNDS + ' right on the first try. ' +
      'You got ' + stars + (stars === 1 ? ' star' : ' stars') + '. 🔥 ' + streakNow() + (streakNow() === 1 ? ' day' : ' days') + ' in a row.',
      (ROUNDS - mistakes) + ' dari ' + ROUNDS + ' benar pada percobaan pertama. Kamu dapat ' + stars + ' bintang. 🔥 ' + streakNow() + ' hari berturut-turut.');
    const g = $('rGift');
    g.hidden = !gained.length;
    if (gained.length) g.innerHTML = '<b>' + T('New sticker!', 'Stiker baru!') + '</b><div class="stk">' + gained.map(face).join('') + '</div><small>' + gained.map((k) => k.name).join(', ') + '</small>';
    $('rNext').hidden = stageIdx + 1 >= STAGES.length;
    sfx.win(); Cendekia.fx.confetti(stars * 25 + (gained.length ? 40 : 0)); Cendekia.fx.reveal($('rStars'), $('rGift'));
  }
  $('rNext').addEventListener('click', () => startStage(stageIdx + 1));
  $('rAgain').addEventListener('click', () => startStage(stageIdx));
  $('qBack').addEventListener('click', () => show('map'));

  function renderStickers() {
    $('stkStars').textContent = S.stars;
    const nx = STICKERS.find((k) => k.at > S.stars);
    $('stkNext').textContent = nx ? T('Collect ' + (nx.at - S.stars) + ' more stars for the next sticker.', 'Kumpulkan ' + (nx.at - S.stars) + ' bintang lagi untuk stiker berikutnya.') : T('You have every sticker. Great!', 'Semua stiker sudah kamu punya. Hebat!');
    $('sgrid').innerHTML = '';
    STICKERS.forEach((k) => {
      const d = document.createElement('div');
      const open = k.at <= S.stars;
      d.className = 'sticker' + (open ? '' : ' locked');
      d.innerHTML = face(k) + '<b></b><small></small>';
      d.querySelector('b').textContent = open ? k.name : '???';
      d.querySelector('small').textContent = open ? T('Collected', 'Terkumpul') : '⭐ ' + k.at;
      $('sgrid').appendChild(d);
    });
  }

  Cendekia.chip($('who'));
  renderHome();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
<script data-goatcounter="https://megawan.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
