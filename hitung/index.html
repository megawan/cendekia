<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Numeria</title>
<meta name="theme-color" content="#e0558a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Everyday math for children, from counting apples to sale prices and train timetables: counting, adding, money, time, sharing and fractions, measuring, percent and trip planning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff5f3; --ink: #1f2a44; --card: #ffffff; --line: #f1d8d6;
    --accent: #e0558a; --accent-d: #b83a6c; --warm: #f2a33a; --good: #1f9d6b; --bad: #d9534f;
    --c-green: #1f9d6b; --c-orange: #f2891f; --c-pink: #e0558a; --c-purple: #7a5af8; --c-blue: #2e90fa;
    --c-teal: #0e9aa7; --c-red: #e5484d; --c-indigo: #4c5fd5;
    --radius: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  html, body { margin: 0; min-height: 100%; color: var(--ink);
    font-family: "Baloo 2", system-ui, sans-serif; touch-action: manipulation; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(circle at 8% 6%, #ffe0ea 0, transparent 36%),
                radial-gradient(circle at 94% 20%, #d6ebff 0, transparent 34%),
                radial-gradient(circle at 50% 100%, #fff0c9 0, transparent 42%); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 2.2rem; margin: 0; line-height: 1.05; letter-spacing: .01em; }
  h2 { font-size: clamp(1.1rem, 5vw, 1.4rem); margin: 0; text-align: center; flex: 1; line-height: 1.15; }
  .sub { margin: 0; opacity: .8; }
  .btn { font: inherit; font-weight: 700; font-size: 1.15rem; border: 0; border-radius: var(--radius);
    padding: 14px 22px; background: var(--accent); color: #fff; cursor: pointer;
    box-shadow: 0 5px 0 var(--accent-d); min-height: 56px; transition: transform .08s, box-shadow .08s, opacity .2s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-d); }
  .btn.go { background: var(--good); box-shadow: 0 5px 0 #13714c; }
  .btn.ghost { background: rgba(255,255,255,.85); color: var(--ink); box-shadow: none; border: 2px solid var(--line); }
  .btn:disabled { opacity: .45; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--c-purple); outline-offset: 2px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .bar .btn { padding: 8px 14px; min-height: 46px; font-size: 1rem; box-shadow: none; }
  .stack { display: grid; gap: 14px; max-width: 420px; margin: 20px auto; }
  .spacer { width: 46px; }
  .note { font-size: .95rem; text-align: center; opacity: .8; margin-top: 16px; }
  .note a { color: inherit; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 2px solid var(--line);
    border-radius: 999px; padding: 4px 14px 4px 10px; font-weight: 700; white-space: nowrap; }
  .pill .ic { font-size: 1.2rem; line-height: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes hop { 30% { transform: translateY(-14px) scale(1.08); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  @keyframes fadeUp { from { transform: translateY(8px); opacity: 0; } }

  /* Home */
  .homeTop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hero { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 8px 0 12px; }
  .owl { font-size: 4.2rem; line-height: 1; display: inline-block; animation: bob 3s ease-in-out infinite; }
  .pills { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .scale { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .9rem; margin: 0 4px 10px; }
  .scale i { flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #8fd6a8, #f2c14e, #f2891f, #e5484d); }
  .worlds { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (min-width: 620px) { .worlds { grid-template-columns: 1fr 1fr 1fr 1fr; } }
  .card { --c: var(--c-blue); position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
    text-align: center; background: var(--card); border: 2px solid var(--line); border-bottom: 6px solid var(--c);
    border-radius: var(--radius); padding: 14px 8px 12px; font: inherit; color: inherit; cursor: pointer;
    transition: transform .15s; animation: popIn .45s both; }
  .card:hover { transform: translateY(-3px); }
  .card:active { transform: translateY(3px); }
  .card .num { position: absolute; top: 8px; left: 10px; font-weight: 800; font-size: .85rem; opacity: .45; }
  .card .badge { width: 62px; height: 62px; border-radius: 50%; background: var(--c); color: #fff;
    display: grid; place-items: center; font-size: 2rem; line-height: 1; box-shadow: inset 0 -5px 0 rgba(0,0,0,.12); }
  .card b { font-size: 1.1rem; line-height: 1.2; }
  .card small { font-size: .82rem; opacity: .75; line-height: 1.2; }
  .card .skill { font-size: .72rem; font-weight: 700; color: var(--c); text-transform: uppercase; letter-spacing: .04em; line-height: 1.2; }
  .card .meter { width: 80%; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .card .meter i { display: block; height: 100%; background: var(--warm); border-radius: 4px; }
  .card.wide { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 16px; }
  .card.wide span:last-child { text-align: left; }

  /* World: level picker */
  .about { display: flex; align-items: center; gap: 12px; background: #fff; border: 2px solid var(--line);
    border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; }
  .about .badge { flex: none; width: 54px; height: 54px; border-radius: 50%; background: var(--c); display: grid;
    place-items: center; font-size: 1.7rem; }
  .about p { margin: 0; line-height: 1.3; }
  .about small { font-weight: 700; color: var(--c); text-transform: uppercase; font-size: .75rem; letter-spacing: .04em; }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 10px; }
  .lv { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .lv button { width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff; cursor: pointer;
    background: var(--c, var(--c-blue)); color: #fff; font: inherit; font-weight: 800; font-size: 1.8rem; line-height: 1;
    box-shadow: 0 6px 0 rgba(0,0,0,.18); transition: transform .1s; animation: popIn .4s both; }
  .lv button:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .lv.locked button { background: #d4d9e2; cursor: default; font-size: 1.4rem; }
  .lv.next button { animation: popIn .4s both, bounce 1.2s ease-in-out .4s infinite;
    box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 0 0 7px rgba(242,163,58,.35); }
  .lv small { font-size: .85rem; text-align: center; line-height: 1.15; min-height: 2.3em; }
  .lv .tier { font-size: .72rem; font-weight: 700; opacity: .7; }
  .st { display: flex; gap: 2px; height: 20px; }
  .st svg { width: 20px; height: 20px; fill: var(--line); }
  .st svg.on { fill: var(--warm); }

  /* Play */
  .prog { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; }
  .prog i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
  .prog i.ok { background: var(--good); }
  .prog i.miss { background: var(--warm); }
  .prog i.now { background: var(--accent); transform: scale(1.25); }
  .coach { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .coach .owl { font-size: 3rem; animation: none; flex: none; }
  .coach .owl.cheer { animation: hop .5s ease-out; }
  .coach .owl.oops { animation: shake .35s; }
  .bubble { position: relative; flex: 1; background: #fff; border: 2px solid var(--line); border-radius: 16px;
    padding: 8px 14px; font-weight: 700; font-size: 1.15rem; line-height: 1.3; }
  .bubble::before { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -8px; width: 14px; height: 14px;
    background: #fff; border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
  .scene { background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 14px;
    min-height: 90px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 14px; animation: fadeUp .3s both; }
  .scene:empty { display: none; }
  .pics { display: grid; grid-template-columns: repeat(5, auto); gap: 4px 8px; font-size: 2.1rem; line-height: 1.15; }
  .pics.small { font-size: 1.5rem; gap: 2px 4px; }
  .pics span { animation: popIn .35s both; }
  .pics span.gone { opacity: .25; filter: grayscale(1); }
  .op { font-size: 2rem; font-weight: 800; color: var(--accent); }
  .plates { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .plate { background: #fff7ec; border: 2px dashed #f0cfa0; border-radius: 50%; min-width: 96px; min-height: 96px;
    padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .plate > b { font-size: .9rem; opacity: .7; }
  .plate.tray { border-radius: 18px; }
  .coin, .bill { display: inline-grid; place-items: center; font-weight: 800; animation: popIn .35s both; }
  .coin { width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, #f2c14e 60%, #d79a1c);
    border: 3px solid #c58a12; color: #6b4a00; font-size: 1.05rem; }
  .coin.c2 { width: 60px; height: 60px; background: radial-gradient(circle at 35% 30%, #f6f6f6, #c7ccd4 60%, #98a0ad); border-color: #8a929f; color: #3a404a; }
  .bill { width: 92px; height: 50px; border-radius: 8px; background: #bfe8cf; border: 3px solid #4fb07a; color: #1d6b41; font-size: 1.2rem; }
  .bill.b10 { background: #cfe2ff; border-color: #4c84d6; color: #1f4c94; }
  .bill.b20 { background: #ffe0c2; border-color: #e08a3a; color: #8a4410; }
  .bill.b50 { background: #ead9ff; border-color: #8a5ad6; color: #4a2590; }
  .money { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 8px; background: #fff8e1; border: 2px solid #f1dfb2;
    border-radius: 12px 26px 26px 12px; padding: 6px 16px 6px 10px; font-weight: 800; font-size: 1.2rem; }
  .tag .e { font-size: 1.8rem; line-height: 1; }
  .tag small { font-weight: 600; font-size: .95rem; opacity: .8; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chips span { background: #f4f6fb; border: 2px solid #d9e0ee; border-radius: 12px; padding: 4px 12px; font-weight: 800; font-size: 1.25rem; }
  .clocks { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; text-align: center; font-weight: 700; }
  .clock { width: 150px; height: 150px; display: block; }
  .clocks .clock { width: 120px; height: 120px; }
  .clock .face { fill: #fff; stroke: var(--ink); stroke-width: 3; }
  .clock .tk { stroke: #9aa3b5; stroke-width: 1; }
  .clock .tk5 { stroke: var(--ink); stroke-width: 2.2; }
  .clock text { font: 700 9.5px "Baloo 2", system-ui, sans-serif; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  .clock .hh { stroke: var(--ink); stroke-width: 4.5; stroke-linecap: round; }
  .clock .mh { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
  .digital { display: inline-block; background: var(--ink); color: #7ef0c4; border-radius: 10px; padding: 2px 12px;
    font-weight: 800; font-size: 1.3rem; letter-spacing: .05em; }
  .pie { width: 150px; height: 150px; }
  .pie .sl { fill: #fbeee0; stroke: #c99a6b; stroke-width: 1.5; }
  .pie .sl.on { fill: #f6b74a; }
  .pie .crust { fill: none; stroke: #c98a3f; stroke-width: 5; }
  .svgbox { width: 100%; max-width: 440px; height: auto; display: block; }
  .svgbox text { font: 700 11px "Baloo 2", system-ui, sans-serif; fill: var(--ink); }
  table.tt { border-collapse: collapse; font-weight: 700; font-size: 1.1rem; background: #fff; }
  table.tt th, table.tt td { border: 2px solid var(--line); padding: 4px 14px; text-align: center; }
  table.tt th { background: #fff0f5; }
  .frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 800; vertical-align: middle; }
  .frac span:first-child { border-bottom: 3px solid currentColor; padding: 0 4px 2px; }
  .frac span:last-child { padding-top: 2px; }

  /* Answers */
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opts.three { grid-template-columns: repeat(3, 1fr); }
  .opt { font: inherit; font-weight: 800; font-size: 1.45rem; min-height: 70px; border-radius: var(--radius);
    background: #fff; color: var(--ink); border: 3px solid var(--line); box-shadow: 0 5px 0 var(--line);
    cursor: pointer; padding: 8px; transition: transform .08s; animation: popIn .3s both; }
  .opt:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
  .opt.ok { background: #e3f7ec; border-color: var(--good); box-shadow: 0 5px 0 var(--good); animation: hop .45s; }
  .opt.no { background: #fdecec; border-color: var(--bad); box-shadow: none; opacity: .6; animation: shake .35s; }
  .padWrap { max-width: 360px; margin: 0 auto; }
  .display { display: flex; align-items: center; justify-content: center; gap: 6px; background: #fff; border: 3px solid var(--line);
    border-radius: var(--radius); min-height: 70px; font-size: 2rem; font-weight: 800; margin-bottom: 12px; }
  .display .val { min-width: 1ch; }
  .display .val:empty::before { content: "?"; opacity: .3; }
  .display .unit { font-size: 1.3rem; opacity: .65; }
  .display.ok { border-color: var(--good); background: #e3f7ec; }
  .display.no { border-color: var(--bad); animation: shake .35s; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .key { font: inherit; font-weight: 800; font-size: 1.6rem; min-height: 60px; border-radius: 16px; background: #fff;
    border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); color: var(--ink); cursor: pointer; }
  .key:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .key.check { grid-column: 1 / -1; background: var(--good); border-color: var(--good); color: #fff; box-shadow: 0 5px 0 #13714c; font-size: 1.3rem; }
  .why { background: #fff8e1; border: 2px solid #f1dfb2; border-radius: var(--radius); padding: 12px 14px; margin-top: 14px;
    text-align: center; animation: fadeUp .3s both; }
  .why p { margin: 0 0 10px; font-size: 1.1rem; line-height: 1.35; }
  .why b.ans { color: var(--good); }

  /* Result */
  .result { text-align: center; }
  .result .owl { font-size: 5rem; animation: hop .6s ease-out; }
  .stars { display: flex; justify-content: center; gap: 8px; }
  .stars svg { width: 60px; height: 60px; fill: var(--line); }
  .stars svg.on { fill: var(--warm); animation: popIn .5s both; }
  .stars svg.on:nth-child(2) { animation-delay: .2s; }
  .stars svg.on:nth-child(3) { animation-delay: .4s; }
  .summary { font-size: 1.15rem; margin: 0; }
  .gift { background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 10px; font-weight: 700; }
  .gift .face { font-size: 2.6rem; display: block; animation: popIn .5s .5s both; }

  /* Stickers */
  .sgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (min-width: 620px) { .sgrid { grid-template-columns: repeat(4, 1fr); } }
  .stk { background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 10px 6px; text-align: center; }
  .stk .face { font-size: 2.6rem; display: grid; place-items: center; width: 70px; height: 70px; margin: 0 auto 4px;
    border-radius: 50%; background: var(--c); }
  .stk.lock .face { filter: grayscale(1) brightness(1.3); opacity: .35; }
  .stk b { display: block; line-height: 1.15; }
  .stk small { opacity: .7; }

  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  #fx span { position: absolute; top: -40px; font-size: 1.8rem; animation: fall 2.4s ease-in forwards; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><path id="starPath" d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></defs>
</svg>
<main>
  <!-- Home: the eight places in town, from the easiest to the hardest -->
  <section id="home">
    <div class="homeTop"><div id="who"></div><span class="pill" title="Days in a row"><span class="ic" aria-hidden="true">🔥</span><span id="homeDays">0 days</span></span></div>
    <div class="hero">
      <span class="owl" aria-hidden="true">🦉</span>
      <div>
        <h1>Numeria</h1>
        <p class="sub">Math for everyday life, with Ollie the owl</p>
      </div>
    </div>
    <div class="pills">
      <span class="pill" title="Stars"><span class="ic" aria-hidden="true">⭐</span><span id="homeStars">0 stars</span></span>
      <span class="pill" title="Stickers"><span class="ic" aria-hidden="true">🏠</span><span id="homeStk">0/12</span> stickers</span>
    </div>
    <div class="scale" aria-hidden="true"><span>🌱 Easiest</span><i></i><span>🏆 Hardest</span></div>
    <div class="worlds" id="worlds"></div>
    <p class="note"><a href="../orangtua/">👪 For parents</a> · <a href="../">← More apps in Cendekia</a></p>
  </section>

  <!-- One place: its six levels -->
  <section id="world" hidden>
    <div class="bar">
      <button type="button" class="btn ghost" data-go="home">← Town</button>
      <h2 id="wTitle">Levels</h2><span class="spacer"></span>
    </div>
    <div class="about" id="wAbout"></div>
    <div class="levels" id="levels"></div>
  </section>

  <!-- A round of questions -->
  <section id="play" hidden>
    <div class="bar">
      <button type="button" class="btn ghost" id="pBack">← Levels</button>
      <div class="prog" id="prog"></div>
      <span class="spacer"></span>
    </div>
    <div class="coach">
      <span class="owl" id="coach" aria-hidden="true">🦉</span>
      <div class="bubble" id="say" aria-live="polite"></div>
    </div>
    <div class="scene" id="scene"></div>
    <div id="answers"></div>
    <div class="why" id="why" hidden aria-live="polite">
      <p id="whyText"></p>
      <button type="button" class="btn go" id="whyNext">Next →</button>
    </div>
  </section>

  <!-- Result -->
  <section id="result" class="result" hidden>
    <div class="stack">
      <span class="owl" aria-hidden="true">🦉</span>
      <h2 id="resTitle">Great!</h2>
      <div class="stars" id="resStars"></div>
      <p class="summary" id="resText"></p>
      <div class="gift" id="resGift" hidden></div>
      <button type="button" class="btn go" id="resNext">Next level</button>
      <button type="button" class="btn" id="resAgain">Play again</button>
      <button type="button" class="btn ghost" id="resWorld">Choose a level</button>
    </div>
  </section>

  <!-- Stickers -->
  <section id="stickers" hidden>
    <div class="bar">
      <button type="button" class="btn ghost" data-go="home">← Back</button>
      <h2>Town Stickers</h2>
      <span class="pill"><span class="ic" aria-hidden="true">⭐</span><span id="stkStars">0</span></span>
    </div>
    <p class="note" id="stkNext"></p>
    <div class="sgrid" id="sgrid"></div>
  </section>
</main>
<div id="fx" aria-hidden="true"></div>

<script src="../shared/profile.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const CD = window.Cendekia;

  // ---- Random helpers ----
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    $('disp').classList.remove('no');
    if (k === '⌫') { v.textContent = v.textContent.slice(0, -1); return; }
    if (k === 'ok') { if (v.textContent && v.textContent !== '.') answer(v.textContent); return; }
    if (k === '.' && (!qs[qi].dec || v.textContent.includes('.'))) return;
    if (v.textContent.length >= 7) return;
    if (/^\d$/.test(k) && v.textContent.includes('.') && v.textContent.split('.')[1].length >= 2) return;
    sfx.tap(); v.textContent = (v.textContent === '0' && k !== '.' ? '' : v.textContent) + k;
  }
  document.addEventListener('keydown', (e) => {
    if ($('play').hidden || !qs[qi] || qs[qi].kind !== 'pad') return;
    if (/^[0-9.]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('⌫');
    else if (e.key === 'Enter') { e.preventDefault(); if (!$('why').hidden) $('whyNext').click(); else press('ok'); }
  });

  function answer(v, btn) {
    if (locked) return;
    const q = qs[qi];
    const right = q.kind === 'choice' ? v === q.ans : Math.abs(Number(v) - q.ans) < 1e-6;
    if (right) {
      locked = true;
      if (tries === 0) results.push(true); else results.push(false);
      sfx.good(); mood('cheer');
      $('say').textContent = pick(PRAISE);
      if (btn) btn.classList.add('ok'); else $('disp').classList.add('ok');
      renderProg();
      setTimeout(next, 900);
      return;
    }
    tries++;
    sfx.bad(); mood('oops');
    if (tries === 1) CD.weak('hitung', curWorld.name + ': ' + curWorld.levels[curLevel][0]);
    if (btn) { btn.classList.add('no'); btn.disabled = true; } else { $('disp').classList.remove('no'); void $('disp').offsetWidth; $('disp').classList.add('no'); $('val').textContent = ''; }
    if (tries === 1) { $('say').textContent = 'Not quite. Have another go!'; return; }
    // Second miss: show the answer and how to get it.
    locked = true;
    results.push(false);
    renderProg();
    const shown = q.kind === 'choice' ? label(q.ans) : esc(q.pre + (Number.isInteger(q.ans) ? q.ans : q.ans.toFixed(2).replace(/0$/, '').replace(/\.0?$/, '')) + (q.post ? ' ' + q.post : ''));
    if (q.kind === 'choice') $('answers').querySelectorAll('.opt').forEach((b) => { if (b.dataset.v === q.ans) b.classList.add('ok'); b.disabled = true; });
    else { $('val').textContent = String(q.ans); $('disp').classList.remove('no'); $('disp').classList.add('ok'); }
    $('say').textContent = 'Let me show you how.';
    $('whyText').innerHTML = 'The answer is <b class="ans">' + shown + '</b>. ' + esc(q.why);
    $('why').hidden = false;
    $('whyNext').focus();
  }
  $('whyNext').addEventListener('click', () => { sfx.tap(); next(); });
  function next() {
    if ($('play').hidden) return;
    qi++;
    if (qi < qs.length) ask(); else finish();
  }
  $('pBack').addEventListener('click', () => { sfx.tap(); show('world'); });

  function finish() {
    const w = curWorld, i = curLevel, right = results.filter(Boolean).length, misses = qs.length - right;
    const stars = misses === 0 ? 3 : misses <= 2 ? 2 : 1;
    const before = totalStars();
    S.best[w.id + '.' + i] = Math.max(best(w, i), stars);
    S.stars = totalStars();
    markDay(); save();
    CD.round({ app: 'hitung', stage: w.name + ' ' + (i + 1), stars, right, total: qs.length, ms: Date.now() - started });
    show('result');
    sfx.win();
    $('resTitle').textContent = stars === 3 ? 'Perfect!' : stars === 2 ? 'Great job!' : 'Well done!';
    $('resStars').innerHTML = [0, 1, 2].map((k) => starSvg(k < stars)).join('');
    $('resText').textContent = right + ' of ' + qs.length + ' right on the first try.' + (stars < 3 ? ' Play again for ' + (stars === 2 ? 'three' : 'more') + ' stars!' : '');
    const gained = STICKERS.filter((k) => k.at > before && k.at <= S.stars);
    $('resGift').hidden = !gained.length;
    if (gained.length) $('resGift').innerHTML = '<span class="face" aria-hidden="true">' + gained[gained.length - 1].pic + '</span>New sticker: ' + gained[gained.length - 1].name + '!';
    const hasNext = i + 1 < w.levels.length;
    $('resNext').hidden = !hasNext;
    if (stars === 3) confetti();
  }
  $('resNext').addEventListener('click', () => { sfx.tap(); startLevel(curWorld, curLevel + 1); });
  $('resAgain').addEventListener('click', () => { sfx.tap(); startLevel(curWorld, curLevel); });
  $('resWorld').addEventListener('click', () => { sfx.tap(); show('world'); });

  function confetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const fx = $('fx');
    for (let k = 0; k < 24; k++) {
      const s = document.createElement('span');
      s.textContent = pick(['⭐', '🎉', '✨', '🍕', '🪙', '🍎']);
      s.style.left = R(0, 96) + '%'; s.style.animationDelay = (Math.random() * 0.6).toFixed(2) + 's';
      fx.appendChild(s); setTimeout(() => s.remove(), 3200);
    }
  }

  CD.chip($('who'));
  show('home');

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
<script data-goatcounter="https://megawan.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
