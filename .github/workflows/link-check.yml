name: Links

on:
  pull_request:
    paths: ["**/*.html", "**/*.md", ".github/workflows/link-check.yml"]
  push:
    branches: [main]
    paths: ["**/*.html", "**/*.md", ".github/workflows/link-check.yml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  links:
    permissions:
      contents: read
    uses: megawan/gha-shared-workflows/.github/workflows/site-link-check.yml@v1
    with:
      paths: "**/*.html **/*.md"
      # External sites can be down for a while: the weekly run only reports,
      # while pull requests and pushes fail on broken links.
      fail: ${{ github.event_name != 'schedule' }}
