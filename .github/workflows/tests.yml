name: Tests

on:
  # Merged changes are not tested again: the pull request already ran them.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions: {}

jobs:
  playwright:
    # Opt-in on pull requests: runs only while the PR has the run-tests label (new pushes re-run it).
    # Adding the label starts a run; adding any other label does not. Always runs on manual dispatch.
    if: >-
      github.event_name != 'pull_request' || (
        (github.event.action != 'labeled' || github.event.label.name == 'run-tests') &&
        contains(github.event.pull_request.labels.*.name, 'run-tests')
      )
    name: Playwright
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
