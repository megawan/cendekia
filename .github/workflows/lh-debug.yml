name: LH debug
on:
  pull_request:
    paths: [".github/workflows/lh-debug.yml"]
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: |
          cat > /tmp/rc.json <<'J'
          {"ci":{"collect":{"staticDistDir":".","numberOfRuns":3,"url":["http://localhost/numeria/index.html"],"settings":{"chromeFlags":"--no-sandbox --headless=new"}},"upload":{"target":"filesystem","outputDir":"/tmp/out"}}}
          J
          npx --yes @lhci/cli@0.15.1 autorun --config=/tmp/rc.json || true
          node -e '
          const fs=require("fs");
          for(const f of fs.readdirSync("/tmp/out").filter(f=>/report\.json$/.test(f))){
            const r=JSON.parse(fs.readFileSync("/tmp/out/"+f));
            console.log("RUN",r.categories.performance.score,"bench",r.environment.benchmarkIndex);
            for(const k of ["first-contentful-paint","largest-contentful-paint","speed-index","total-blocking-time","cumulative-layout-shift"])console.log(" ",k,r.audits[k].displayValue);
            for(const [k,a] of Object.entries(r.audits))if(a.score!==null&&a.score<0.9&&a.scoreDisplayMode!=="informative"&&a.scoreDisplayMode!=="notApplicable"&&a.scoreDisplayMode!=="manual")console.log("  AUDIT",k,a.score,a.displayValue||"");
            const m=r.audits.metrics.details.items[0];console.log("  observed",m.observedFirstContentfulPaint,m.observedLargestContentfulPaint,m.timeToFirstByte);
            console.log("  LCPEL",JSON.stringify(r.audits["largest-contentful-paint-element"].details.items[0].items?.[0]?.node?.selector));
          }'
